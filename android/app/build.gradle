// android/app/build.gradle

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android' 

def readSigningValue = { String primaryName, String legacyName ->
    for (String name : [primaryName, legacyName]) {
        def envValue = System.getenv(name)
        if (envValue && envValue.trim()) {
            return envValue
        }

        def propertyValue = project.findProperty(name)
        if (propertyValue != null && propertyValue.toString().trim()) {
            return propertyValue.toString()
        }
    }

    return null
}

def releaseStoreFile = readSigningValue("KEYSTORE_PATH", "RELEASE_STORE_FILE")
def releaseStorePassword = readSigningValue("KEYSTORE_PASS", "RELEASE_STORE_PASSWORD")
def releaseKeyAlias = readSigningValue("KEYSTORE_ALIAS", "RELEASE_KEY_ALIAS")
def releaseKeyPassword = readSigningValue("KEYSTORE_ALIAS_PASS", "RELEASE_KEY_PASSWORD")

def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword
def isReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains("release")
}

if (isReleaseTaskRequested && !hasReleaseSigning) {
    logger.warn("Release signing values are missing; building unsigned release artifacts.")
}

android {
    namespace = "optn.wallet.app"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "optn.wallet.app"
        minSdk = rootProject.ext.minSdkVersion
        targetSdk = rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "1.7.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled = true
            shrinkResources = true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = "21"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.code.gson:gson:2.10.1"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:core:1.6.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
