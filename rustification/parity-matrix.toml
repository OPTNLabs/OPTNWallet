schema = 1
# Production-ready cells are only allowed to be "pass" or "na".
# "fail" and "pending" are computed by xtask from policy vs evidence, never authored.
#
# policy: pass = must work on that surface; na = deliberately unsupported
# evidence: none | unit | e2e | e2e-declared | device | hidden
#   hidden is valid only with policy = na
#   e2e / device = packaged/device test is referenced and treated as proven
#   e2e-declared = packaged E2E exists and is referenced, but a passing run
#                  of this commit's artifact has not yet been claimed
#   --report integrity accepts pending
#   --production-ready requires pass+e2e/device or na+hidden
#   A referenced test file is not proof that the current APK passed CI.

platforms = [
  "windows",
  "linux",
  "macos",
  "android",
  "ios",
  "web",
  "extension",
]

[[feature]]
id = "create_wallet"
name = "Create wallet"
policy = { windows = "pass", linux = "pass", macos = "pass", android = "pass", ios = "pass", web = "pass", extension = "pass" }
evidence = { windows = "e2e", linux = "e2e", macos = "unit", android = "unit", ios = "unit", web = "unit", extension = "unit" }
evidence_refs = { windows = "e2e/specs/create-lock-reopen.spec.ts", linux = "e2e/specs/create-lock-reopen.spec.ts" }

[[feature]]
id = "import_seed"
name = "Import seed"
policy = { windows = "pass", linux = "pass", macos = "pass", android = "pass", ios = "pass", web = "pass", extension = "pass" }
evidence = { windows = "e2e", linux = "e2e", macos = "unit", android = "unit", ios = "unit", web = "unit", extension = "unit" }
evidence_refs = { windows = "e2e/specs/onboarding-navigation.spec.ts", linux = "e2e/specs/onboarding-navigation.spec.ts" }

[[feature]]
id = "watch_only"
name = "Watch-only"
policy = { windows = "pass", linux = "pass", macos = "pass", android = "pass", ios = "pass", web = "na", extension = "na" }
evidence = { windows = "e2e", linux = "e2e", macos = "unit", android = "e2e-declared", ios = "unit", web = "hidden", extension = "hidden" }
evidence_refs = { windows = "e2e/specs/onboarding-navigation.spec.ts", linux = "e2e/specs/onboarding-navigation.spec.ts", android = "android/app/src/androidTest/java/com/getcapacitor/myapp/ExampleInstrumentedTest.java::androidLanding_watchOnlyLifecycle" }
na_reason = { web = "capability matrix hides watch-only on web", extension = "capability matrix hides watch-only on extension" }

