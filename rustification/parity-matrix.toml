[[feature]]
id = "spv"
name = "SPV"
# Evidence corrected from "unit" on the three desktop platforms to "none"
# everywhere. There was no test to point at: SPV has no implementation in any
# Rust crate -- nothing matches `spv`, `merkle` or `block_header` across all 14
# -- and its TypeScript side (`src/platform/desktop/Bip37Backend.ts`,
# `src/features/settings/Bip37NodeSettings.tsx`) has no test file either. The
# feature ships; the coverage claim did not exist. Raise this back to "unit"
# with an `evidence_refs` entry the moment a test does.
policy = { windows = "pass", linux = "pass", macos = "pass", android = "pass", ios = "pass", web = "pass", extension = "pass" }
evidence = { windows = "none", linux = "none", macos = "none", android = "none", ios = "none", web = "none", extension = "none" }

