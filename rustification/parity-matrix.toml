schema = 1
# Production-ready cells are only allowed to be "pass" or "na".
# "fail" and "pending" are computed by xtask from policy vs evidence, never authored.
#
# policy: pass = must work on that surface; na = deliberately unsupported
# evidence: none | unit | e2e | e2e-declared | device | hidden
#   hidden is valid only with policy = na
#   e2e / device = packaged/device test is referenced and treated as proven
#   e2e-declared = packaged E2E exists and is referenced, but a passing run
#                  of this commit's artifact has not yet been claimed
#   --report integrity accepts pending
#   --production-ready requires pass+e2e/device or na+hidden
#   A referenced test file is not proof that the current APK passed CI.

platforms = [
  "windows",
  "linux",
  "macos",
  "android",
  "ios",
  "web",
  "extension",
]

