name: Rust formal verification

on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/optn-core/Cargo.toml'
      - 'crates/optn-core/Cargo.lock'
      - 'crates/optn-core/src/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-formal.yml'
  push:
    branches: [dev, staging]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/optn-core/Cargo.toml'
      - 'crates/optn-core/Cargo.lock'
      - 'crates/optn-core/src/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-formal.yml'
  schedule:
    - cron: '41 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-formal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    name: Kani optn-core proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Kani uses its own pinned Rust toolchain internally. Pin the verifier
      # itself so formal-proof behavior cannot silently change between runs.
      - name: Install Kani 0.67.0
        run: |
          cargo install --locked --version 0.67.0 kani-verifier
          cargo kani setup

      - name: Prove optn-core harnesses
        working-directory: crates/optn-core
        run: cargo kani --output-format=terse
