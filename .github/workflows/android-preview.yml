name: Android Preview (Debug APK)
on:
  pull_request:
    branches: [dev, staging]
    paths:
      - 'src/**'
      - '!src/platform/desktop/**'
      - '!src-tauri/**'
      - 'android/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'reference/**'
      - '.github/workflows/android-preview.yml'
  push:
    branches: [dev, staging]
    paths:
      - 'src/**'
      - '!src/platform/desktop/**'
      - '!src-tauri/**'
      - 'android/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'reference/**'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: npm run android:apk:dev

      - name: Android JVM tests
        run: npm run android:test

      - name: Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: Pixel_2
          script: npm run android:test:instrumented

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: android/**/outputs/apk/debug/*.apk
          retention-days: 14
