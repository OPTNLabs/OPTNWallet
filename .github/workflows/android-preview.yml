name: Android Preview (Debug APK)
on:
  # This check is required by the dev/staging ruleset. Keep the workflow
  # always-on so path-filtered changes do not leave an Expected check forever.
  pull_request:
    # main included: a pull request straight to main is exactly the path
    # that would otherwise reach a release without these asset checks.
    branches: [dev, staging, main]
  push:
    branches: [dev, staging]
  # Allows a maintainer to recover the required check when GitHub does not
  # create the pull_request run for a head update.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Build Debug APK
        # Maven Central answers 429 under load, which reddens pull requests that
        # changed nothing about Android: #60 failed on "Too Many Requests" for a
        # dozen POMs and nothing else. Only that signature is retried -- a real
        # build error still fails on the first attempt instead of costing three.
        run: |
          set -eu
          build_log="$RUNNER_TEMP/android-debug-build.log"
          attempt=1
          while :; do
            set +e
            npm run android:apk:dev 2>&1 | tee "$build_log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            if ! grep -qE 'Too Many Requests|Read timed out|Connection timed out' "$build_log"; then
              exit "$status"
            fi
            if [ "$attempt" -ge 3 ]; then
              echo '::error::the dependency host kept rate limiting after 3 attempts'
              exit "$status"
            fi
            delay=$((attempt * 45))
            echo "Rate limited by the dependency host; retrying in ${delay}s (attempt $((attempt + 1))/3)."
            sleep "$delay"
            attempt=$((attempt + 1))
          done

      - name: Android JVM tests
        run: npm run android:test

      - name: Prepare Android instrumentation tests
        # Every flavour, because both are installed and tested below.
        run: cd android && ./gradlew assemblePlayDebugAndroidTest assembleFdroidDebugAndroidTest

      - name: Configure Android emulator acceleration
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules || true
          sudo udevadm trigger --name-match=kvm || true
          if [ -e /dev/kvm ] && sudo chmod 666 /dev/kvm 2>/dev/null &&
            [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo 'ANDROID_EMULATOR_ACCEL=on' >> "$GITHUB_ENV"
            echo 'KVM is available; using accelerated Android emulator.'
          else
            echo 'ANDROID_EMULATOR_ACCEL=off' >> "$GITHUB_ENV"
            echo 'KVM is unavailable; using software Android emulator.'
          fi

      - name: Android emulator smoke tests
        run: |
          set -eu
          source scripts/stop-child-process.sh

          emulator_serial=emulator-5554
          emulator_log="$RUNNER_TEMP/android-emulator.log"
          avd_home="$RUNNER_TEMP/android-avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"

          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            'build-tools;37.0.0' \
            'platform-tools' \
            'platforms;android-36' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd --force \
            --name test \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_2
          test -f "$ANDROID_AVD_HOME/test.ini"

          emulator_args=()
          if [ "${ANDROID_EMULATOR_ACCEL:-off}" = 'off' ]; then
            emulator_args=(-accel off)
          fi

          "$ANDROID_HOME/emulator/emulator" \
            -port 5554 \
            -avd test \
            -no-window \
            -gpu swiftshader_indirect \
            -memory 2048 \
            -cores 2 \
            -no-snapshot \
            -noaudio \
            -no-boot-anim \
            "${emulator_args[@]}" >"$emulator_log" 2>&1 &
          emulator_pid=$!

          adb_timeout_seconds=15
          adb_with_timeout() {
            timeout "${adb_timeout_seconds}s" adb "$@"
          }

          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo 'Android emulator log:'
              tail -n 120 "$emulator_log" || true
            fi
            adb_with_timeout -s "$emulator_serial" emu kill >/dev/null 2>&1 || true
            # `adb emu kill` occasionally leaves qemu alive. An unbounded wait
            # then consumes the entire job timeout after every test has passed.
            stop_child_process "$emulator_pid"
            trap - EXIT
            exit "$exit_code"
          }
          trap cleanup EXIT

          adb_with_timeout start-server

          device_state=
          device_deadline=$((SECONDS + 360))
          while [ "$SECONDS" -lt "$device_deadline" ]; do
            device_state="$(adb_with_timeout devices |
              awk -v serial="$emulator_serial" '$1 == serial { print $2 }')"
            if [ "$device_state" = 'device' ]; then
              break
            fi
            sleep 2
          done
          echo "Emulator device state: ${device_state:-unavailable}"
          test "$device_state" = 'device'

          boot_completed=
          boot_deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$boot_deadline" ]; do
            boot_completed="$(adb_with_timeout -s "$emulator_serial" shell getprop \
              sys.boot_completed 2>/dev/null | tr -d '\r')" || true
            if [ "$boot_completed" = '1' ]; then
              break
            fi
            sleep 2
          done
          echo "Emulator boot completed: ${boot_completed:-unavailable}"
          test "$boot_completed" = '1'

          api_level=
          api_deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$api_deadline" ]; do
            api_level="$(adb_with_timeout -s "$emulator_serial" shell getprop \
              ro.build.version.sdk 2>/dev/null | tr -d '\r')" || true
            if [ "$api_level" = '36' ]; then
              break
            fi
            sleep 5
          done
          echo "Emulator API level: ${api_level:-unavailable}"
          test "$api_level" = '36'

          activity_manager_config=
          activity_manager_ready=
          activity_manager_successes=0
          activity_manager_deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$activity_manager_deadline" ]; do
            activity_manager_config="$(adb_with_timeout -s "$emulator_serial" shell am \
              get-config 2>&1 | tr -d '\r')" || true
            if printf '%s' "$activity_manager_config" | grep -q '^config: '; then
              activity_manager_successes=$((activity_manager_successes + 1))
            else
              activity_manager_successes=0
            fi
            if [ "$activity_manager_successes" -ge 3 ]; then
              activity_manager_ready=1
              break
            fi
            sleep 5
          done
          echo "Android Activity Manager ready: ${activity_manager_ready:-unavailable}"
          echo "Activity Manager consecutive probes: $activity_manager_successes"
          test "$activity_manager_ready" = '1'

          settings_state=
          settings_ready=
          services_deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$services_deadline" ]; do
            settings_state="$(adb_with_timeout -s "$emulator_serial" shell settings get \
              system screen_off_timeout 2>/dev/null | tr -d '\r')" || true
            if [ -n "$settings_state" ] && ! printf '%s' "$settings_state" |
              grep -Eq '(^null$|Can.t find service|Failure calling service)' && adb_with_timeout -s \
              "$emulator_serial" shell input keyevent 82 >/dev/null 2>&1; then
              settings_ready=1
              break
            fi
            sleep 5
          done
          echo "Android services ready: ${settings_ready:-unavailable}"
          test "$settings_ready" = '1'

          wait_for_package_manager() {
            wait_seconds="$1"
            package_manager_successes=0
            package_manager_deadline=$((SECONDS + wait_seconds))
            while [ "$SECONDS" -lt "$package_manager_deadline" ]; do
              package_manager_output="$(adb_with_timeout -s "$emulator_serial" shell cmd package \
                list packages --user 0 2>&1 | tr -d '\r')" || true
              if printf '%s' "$package_manager_output" | grep -q '^package:android$'; then
                package_manager_successes=$((package_manager_successes + 1))
              else
                package_manager_successes=0
              fi
              if [ "$package_manager_successes" -ge 3 ]; then
                echo "Android package manager ready: 1"
                echo "Package manager consecutive probes: $package_manager_successes"
                return 0
              fi
              sleep 5
            done
            echo "Android package manager ready: unavailable"
            echo "Package manager consecutive probes: $package_manager_successes"
            return 1
          }
          wait_for_package_manager 300

          # Flavoured builds put each APK under its own store directory and
          # rename it, so these are discovered rather than named. Hardcoding
          # the old app-debug.apk path made this step exit 1 with no output at
          # all, because `test -f` under `set -e` says nothing about what it
          # was looking for.
          find_apk() {
            found="$(find "$1" -type f -name "$2" -print -quit 2>/dev/null)"
            if [ -z "$found" ]; then
              # To stderr: this runs inside a command substitution, so on
              # stdout the message would be captured instead of printed —
              # reproducing the silent failure this replaces.
              echo "::error::no APK matching $2 under $1" >&2
              find "$1" -type f -name '*.apk' >&2 2>/dev/null || true
              return 1
            fi
            printf '%s' "$found"
          }
          install_timeout_seconds=900
          install_apk() {
            apk_path="$1"
            package_name="$2"
            install_flags="${3:-}"
            remote_apk="/data/local/tmp/$(basename "$apk_path")"
            install_output="$RUNNER_TEMP/$(basename "$apk_path").install.log"
            install_attempt=1
            while [ "$install_attempt" -le 3 ]; do
              echo "Installing $(basename "$apk_path") ($(stat -c '%s' "$apk_path") bytes; attempt $install_attempt/3)"
              timeout "${install_timeout_seconds}s" adb -s "$emulator_serial" push \
                "$apk_path" "$remote_apk"
              set +e
              timeout "${install_timeout_seconds}s" adb -s "$emulator_serial" shell pm install \
                -r --skip-verification $install_flags "$remote_apk" \
                2>&1 | tee "$install_output"
              install_exit=${PIPESTATUS[0]}
              set -e
              timeout 30s adb -s "$emulator_serial" shell rm -f "$remote_apk" || true
              package_path="$(timeout 30s adb -s "$emulator_serial" shell pm path \
                "$package_name" 2>&1)" || true
              if [ "$install_exit" -eq 0 ] &&
                printf '%s' "$package_path" | grep -q '^package:'; then
                return 0
              fi
              if [ "$install_exit" -ne 0 ]; then
                echo "Package install command exited with status $install_exit."
              fi
              if [ "$install_attempt" -lt 3 ]; then
                echo 'Package state is not installed; waiting for the package service before retrying.'
                wait_for_package_manager 180 || true
              fi
              install_attempt=$((install_attempt + 1))
            done
            echo "Package $package_name was not installed after 3 attempts."
            return 1
          }
          # Both flavours are exercised, not just the default. They differ in
          # their dependencies — fdroid drops Play In-App Updates — and a
          # missing class only shows up when the app actually runs. Booting the
          # emulator is what costs time here; a second install and test run on
          # the same instance is cheap next to shipping a broken F-Droid APK.
          for flavour in play fdroid; do
            echo "::group::instrumentation on the $flavour flavour"
            app_apk="$(find_apk "android/app/build/outputs/apk/$flavour/debug" '*.apk')"
            # Searched by name across the whole androidTest tree rather than
            # at a fixed depth: the test APK carries the flavour in its
            # filename, so this holds whichever directory layout AGP uses.
            test_apk="$(find_apk 'android/app/build/outputs/apk/androidTest' "*${flavour}*.apk")"

            # Both flavours carry the same applicationId, so the previous one
            # has to go before the next is installed.
            adb_with_timeout -s "$emulator_serial" uninstall optn.wallet.app >/dev/null 2>&1 || true
            adb_with_timeout -s "$emulator_serial" uninstall optn.wallet.app.test >/dev/null 2>&1 || true

            install_apk "$app_apk" optn.wallet.app
            install_apk "$test_apk" optn.wallet.app.test -t

            # A freshly installed APK has not been dex-compiled and has no
            # WebView data directory yet. Leaving both to happen inside the
            # instrumentation run puts them under the 5s input-dispatch clock,
            # and the second flavour installed on an instance ANRs while still
            # starting up:
            #
            #   optn.wallet.app/.MainActivity is not responding.
            #   Waited 5000ms for FocusEvent(hasFocus=false)
            #
            # logcat carried no exception and the VM exited 0 for that run --
            # the app was not broken, it was not finished launching. Compiling
            # ahead of time and doing one throwaway launch moves that cost
            # outside the measurement so the test measures what it claims to.
            adb_with_timeout -s "$emulator_serial" shell cmd package compile \
              -m speed -f optn.wallet.app >/dev/null 2>&1 || true
            warm_output="$(timeout 180s adb -s "$emulator_serial" shell am start -W -n \
              optn.wallet.app/.MainActivity 2>&1 | tr -d '\r')" || true
            printf 'Warm-up launch on the %s flavour:\n%s\n' "$flavour" "$warm_output"
            # am start -W has its own launch timeout. Confirm the activity
            # actually became foreground before treating that timeout as a
            # failed launch.
            warm_activity_ready=
            warm_activity_deadline=$((SECONDS + 180))
            while [ "$SECONDS" -lt "$warm_activity_deadline" ]; do
              warm_activity_state="$(adb_with_timeout -s "$emulator_serial" shell dumpsys \
                activity activities 2>/dev/null | tr -d '\r')" || true
              if printf '%s' "$warm_activity_state" | grep -Eq \
                '(mResumedActivity:|topResumedActivity).*optn\.wallet\.app/(\.|optn\.wallet\.app\.)MainActivity'; then
                warm_activity_ready=1
                break
              fi
              sleep 2
            done
            # Asserted, not merely logged: a flavour whose main activity cannot
            # start is exactly what this job exists to catch, and saying so here
            # names the flavour instead of surfacing later as a bare ANR.
            if ! printf '%s' "$warm_output" | grep -q '^Status: ok' &&
              [ "$warm_activity_ready" != '1' ]; then
              echo "::error::MainActivity did not start on the $flavour flavour"
              adb_with_timeout -s "$emulator_serial" logcat -d -t 200 || true
              exit 1
            fi
            adb_with_timeout -s "$emulator_serial" shell am force-stop optn.wallet.app || true
            # Let the activity teardown finish before instrumentation starts its
            # own launch; overlapping the two is what produced the focus-event
            # timeout above.
            sleep 5

            run_instrumentation() {
              method="$1"
              instrumentation_log="$RUNNER_TEMP/android-instrumentation-${flavour}-${method}.log"
              set +e
              timeout 240s adb -s "$emulator_serial" shell am instrument -w -r \
                -e class "com.getcapacitor.myapp.ExampleInstrumentedTest#${method}" \
                optn.wallet.app.test/androidx.test.runner.AndroidJUnitRunner \
                | tee "$instrumentation_log"
              instrumentation_exit=${PIPESTATUS[0]}
              set -e
              if grep -q '^INSTRUMENTATION_FAILED:' "$instrumentation_log" ||
                ! grep -q '^INSTRUMENTATION_CODE: -1$' "$instrumentation_log"; then
                echo "::error::Android instrumentation ${method} failed on the $flavour flavour"
                echo 'Android instrumentation output:'
                cat "$instrumentation_log" || true
                echo 'Android logcat:'
                adb_with_timeout -s "$emulator_serial" logcat -d -t 400 || true
                exit 1
              fi
              test "$instrumentation_exit" -eq 0
            }

            run_instrumentation useAppContext
            run_instrumentation mainActivity_launchesInExpectedPackage
            run_instrumentation androidLanding_exposesAndOpensWatchOnlyWallet
            run_instrumentation androidLanding_watchOnlyCreate

            # Process-death persistence cannot be exercised by force-stopping
            # the target from inside AndroidJUnitRunner: the runner correctly
            # reports that as a target-process crash. End the create invocation,
            # kill the app from the host, then start a fresh instrumentation
            # process to prove the persisted watch-only wallet survives.
            adb_with_timeout -s "$emulator_serial" shell am force-stop optn.wallet.app
            sleep 3
            run_instrumentation androidLanding_watchOnlyRelaunch

            echo "::endgroup::"
          done

      # assembleDebug builds every flavour, so both APKs should exist. Nothing
      # checked that: the upload was one artifact over a glob with no
      # if-no-files-found, so an F-Droid variant that stopped building would
      # have left the preview green with the Play APK alone in the artifact.
      # That is the same shape of hole the release had.
      - name: Verify both store flavours built
        run: |
          missing=0
          for flavour in play fdroid; do
            if find android -type f -path "*/outputs/apk/${flavour}/debug/*.apk" -print -quit \
              | grep -q .; then
              echo "  ok       ${flavour} debug APK"
            else
              echo "::error::${flavour} debug APK was not produced"
              missing=1
            fi
          done
          exit "$missing"

      # F-Droid's inclusion policy covers dependencies, not just the
      # application. ML Kit is proprietary and arrives with Play Services, a
      # native barcode engine and TensorFlow Lite models — roughly 20 MB of
      # closed binaries. android/app/build.gradle excludes it and every scan
      # goes through ZXing instead; nothing else would notice if that
      # exclusion were dropped, because the app would keep working.
      - name: Verify no proprietary barcode scanner is bundled
        run: |
          mapfile -t apks < <(find android -type f -path '*/outputs/apk/*/debug/*.apk' | sort)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo '::error::no debug APKs to inspect'
            exit 1
          fi
          bash scripts/assert-no-proprietary-scanner.sh "${apks[@]}"

      - name: Upload Play debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-debug-play
          path: android/**/outputs/apk/play/debug/*.apk
          if-no-files-found: error

      - name: Upload F-Droid debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-debug-fdroid
          path: android/**/outputs/apk/fdroid/debug/*.apk
          if-no-files-found: error
          retention-days: 14
