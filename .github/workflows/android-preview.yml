name: Android Preview (Debug APK)
on:
  pull_request:
    branches: [dev, staging]
    paths:
      - 'src/**'
      - '!src/platform/desktop/**'
      - '!src-tauri/**'
      - 'android/**'
      - 'public/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'reference/**'
      - '.github/workflows/android-preview.yml'
  push:
    branches: [dev, staging]
    paths:
      - 'src/**'
      - '!src/platform/desktop/**'
      - '!src-tauri/**'
      - 'android/**'
      - 'public/**'
      - 'scripts/**'
      - 'capacitor.config.ts'
      - 'vite.config.ts'
      - 'reference/**'
      - '.github/workflows/android-preview.yml'

permissions:
  contents: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Enable Gradle cache
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

      - name: Build Debug APK
        run: npm run android:apk:dev

      - name: Android JVM tests
        run: npm run android:test

      - name: Android emulator smoke tests
        run: |
          set -eu

          emulator_serial=emulator-5554
          emulator_log="$RUNNER_TEMP/android-emulator.log"
          avd_home="$RUNNER_TEMP/android-avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"

          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install \
            'build-tools;37.0.0' \
            'platform-tools' \
            'platforms;android-36' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64' >/dev/null
          echo no | avdmanager create avd --force \
            --name test \
            --package 'system-images;android-36;google_apis;x86_64' \
            --device pixel_2
          test -f "$ANDROID_AVD_HOME/test.ini"

          "$ANDROID_HOME/emulator/emulator" \
            -port 5554 \
            -avd test \
            -no-window \
            -gpu swiftshader_indirect \
            -no-snapshot \
            -noaudio \
            -no-boot-anim >"$emulator_log" 2>&1 &
          emulator_pid=$!

          cleanup() {
            exit_code=$?
            if [ "$exit_code" -ne 0 ]; then
              echo 'Android emulator log:'
              tail -n 120 "$emulator_log" || true
            fi
            adb -s "$emulator_serial" emu kill >/dev/null 2>&1 || true
            wait "$emulator_pid" 2>/dev/null || true
            trap - EXIT
            exit "$exit_code"
          }
          trap cleanup EXIT

          adb start-server

          device_state=
          attempt=1
          while [ "$attempt" -le 180 ]; do
            device_state="$(adb devices |
              awk -v serial="$emulator_serial" '$1 == serial { print $2 }')"
            if [ "$device_state" = 'device' ]; then
              break
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "Emulator device state: ${device_state:-unavailable}"
          test "$device_state" = 'device'

          boot_completed=
          attempt=1
          while [ "$attempt" -le 600 ]; do
            boot_completed="$(adb -s "$emulator_serial" shell getprop \
              sys.boot_completed 2>/dev/null | tr -d '\r')" || true
            if [ "$boot_completed" = '1' ]; then
              break
            fi
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "Emulator boot completed: ${boot_completed:-unavailable}"
          test "$boot_completed" = '1'

          api_level=
          attempt=1
          while [ "$attempt" -le 60 ]; do
            api_level="$(adb -s "$emulator_serial" shell getprop \
              ro.build.version.sdk 2>/dev/null | tr -d '\r')" || true
            if [ "$api_level" = '36' ]; then
              break
            fi
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "Emulator API level: ${api_level:-unavailable}"
          test "$api_level" = '36'

          settings_state=
          settings_ready=
          attempt=1
          while [ "$attempt" -le 24 ]; do
            settings_state="$(adb -s "$emulator_serial" shell settings get \
              system screen_off_timeout 2>/dev/null | tr -d '\r')" || true
            if [ -n "$settings_state" ] && ! printf '%s' "$settings_state" |
              grep -Eq 'Can.t find service|Failure calling service' && adb -s
              "$emulator_serial" shell input keyevent 82 >/dev/null 2>&1; then
              settings_ready=1
              break
            fi
            sleep 5
            attempt=$((attempt + 1))
          done
          echo "Android services ready: ${settings_ready:-unavailable}"
          test "$settings_ready" = '1'

          npm run android:test:instrumented

      - name: Upload Debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: app-debug
          path: android/**/outputs/apk/debug/*.apk
          retention-days: 14
