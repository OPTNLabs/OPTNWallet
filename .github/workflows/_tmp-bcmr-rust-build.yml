name: Temporary BCMR Rust build

on:
  push:
    branches:
      - perf/rust-bcmr-author-dev

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - run: npm ci --ignore-scripts
      - run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - run: cargo fmt --all --check
      - run: cargo clippy -p optn-core --all-targets -- -D warnings
      - run: cargo test -p optn-core
      - run: npx --no-install tsx scripts/build-optn-core-wasm.mts
      - name: Commit generated WASM and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/wasm/optn-core/generated
          git rm .github/workflows/_tmp-bcmr-rust-build.yml
          git commit -m "chore(wasm): regenerate BCMR authoring bindings"
          git push origin "HEAD:${GITHUB_REF_NAME}"
