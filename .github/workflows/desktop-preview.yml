name: Desktop Preview

# Mirrors android-preview.yml — builds on every push/PR to dev
# Produces unsigned debug builds for every native desktop target

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'reference/**'
      - 'scripts/fetch-tor.mts'
      - 'vite.desktop.config.ts'
      - 'package.json'
      - '.github/workflows/desktop-preview.yml'
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'reference/**'
      - 'scripts/fetch-tor.mts'
      - 'vite.desktop.config.ts'
      - 'package.json'
      - '.github/workflows/desktop-preview.yml'

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop-preview:
    name: Preview (${{ matrix.platform }})
    # Uncached Linux AppImage packaging can take slightly over 40 minutes.
    timeout-minutes: 60
    env:
      # macOS runners have less memory; the Vite frontend build (Tauri beforeBuildCommand)
      # OOMs at Node's default heap. Raise it for all platforms (harmless on Windows/Linux).
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            tor-target: windows-x86_64
            artifact-name: preview-windows
          - platform: macos-latest
            target: aarch64-apple-darwin
            tor-target: macos-aarch64
            artifact-name: preview-macos-arm
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            tor-target: macos-x86_64
            artifact-name: preview-macos-intel
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tor-target: linux-x86_64
            artifact-name: preview-linux
          - platform: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            tor-target: linux-aarch64
            artifact-name: preview-linux-arm

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Linux system dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libfuse2 \
            libevent-2.1-7 \
            libudev-dev libusb-1.0-0-dev pkg-config
          # hidapi (Ledger/Trezor native USB) needs libudev; rusb needs libusb.
          if [ "${{ matrix.tor-target }}" = 'linux-aarch64' ]; then
            # Tor ARM is built from the checksum-pinned source release.
            sudo apt-get install -y build-essential libevent-dev zlib1g-dev
          fi

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch bundled Tor (integrated CashFusion privacy)
        run: npx --no-install tsx scripts/fetch-tor.mts ${{ matrix.tor-target }}

      - name: Build Tauri (debug)
        # No --bundles: tauri.conf.json already says targets "all", and a preview
        # that skipped a format would stop being a preview of what ships. Linux
        # builds the AppImage here too, which is the only place linuxdeploy runs
        # before release.yml gates a release on the resulting file.
        #
        # --verbose because the AppImage bundler swallows linuxdeploy's stderr:
        # a failure prints `failed to run linuxdeploy` and nothing else, which
        # is not enough to fix anything. Drop it once the AppImage builds green.
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          NO_STRIP: 'true'
        run: npx tauri build --debug --target ${{ matrix.target }} --verbose

      - name: Smoke-test packaged Linux Tor
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          APPIMAGE_PATH="$(find "src-tauri/target/${{ matrix.target }}/debug/bundle" -type f -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE_PATH"
          npx --no-install tsx scripts/smoke-tor-artifact.mts "$APPIMAGE_PATH" "${{ matrix.tor-target }}"

      - name: Upload preview artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/${{ matrix.target }}/debug/bundle/**
          retention-days: 14
          if-no-files-found: error
