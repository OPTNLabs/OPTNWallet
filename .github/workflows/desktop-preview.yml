name: Desktop Preview

# Mirrors android-preview.yml — builds on every push/PR to dev
# Produces unsigned debug builds for all 3 desktop platforms

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'reference/**'
      - 'vite.desktop.config.ts'
      - 'package.json'
      - '.github/workflows/desktop-preview.yml'
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'public/**'
      - 'src-tauri/**'
      - 'reference/**'
      - 'vite.desktop.config.ts'
      - 'package.json'
      - '.github/workflows/desktop-preview.yml'

concurrency:
  group: desktop-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-desktop-preview:
    name: Preview (${{ matrix.platform }})
    timeout-minutes: 40
    env:
      # macOS runners have less memory; the Vite frontend build (Tauri beforeBuildCommand)
      # OOMs at Node's default heap. Raise it for all platforms (harmless on Windows/Linux).
      NODE_OPTIONS: --max-old-space-size=4096
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact-name: preview-windows
            bundle-args: ''
          - platform: macos-latest
            artifact-name: preview-macos
            bundle-args: ''
          # Linux: skip the AppImage bundle. linuxdeploy fails on GitHub runners
          # (no FUSE; APPIMAGE_EXTRACT_AND_RUN didn't help either), and a debug
          # preview only needs an installable — deb+rpm bundle fine. The release
          # workflow still builds the AppImage (with libfuse2) for distribution.
          - platform: ubuntu-22.04
            artifact-name: preview-linux
            bundle-args: '--bundles deb,rpm'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch bundled Tor (integrated CashFusion privacy)
        run: node scripts/fetch-tor.mjs

      - name: Build Tauri (debug)
        # bundle-args is empty on Windows/macOS and '--bundles deb,rpm' on Linux
        # (skips the AppImage that linuxdeploy can't build on the runner).
        run: npx tauri build --debug ${{ matrix.bundle-args }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/debug/bundle/**
          retention-days: 14
          if-no-files-found: warn
