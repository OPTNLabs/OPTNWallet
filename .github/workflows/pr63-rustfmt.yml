name: PR63 Rustfmt

on:
  push:
    branches:
      - agent/rpa-shared-vectors
    paths:
      - 'crates/**/*.rs'
      - 'xtask/**/*.rs'
      - '.github/workflows/pr63-rustfmt.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr63-rustfmt
  cancel-in-progress: false

jobs:
  format:
    if: github.repository == 'CyberAshven/OPTNWallet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/rpa-shared-vectors
          persist-credentials: true

      - name: Install pinned Rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.0
          components: rustfmt

      - name: Format workspace
        run: cargo fmt --all

      - name: Commit formatting if needed
        run: |
          set -euo pipefail
          git add crates xtask
          if git diff --cached --quiet; then
            echo 'Rust formatting already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(rust): apply rustfmt'
          git push origin HEAD:agent/rpa-shared-vectors
