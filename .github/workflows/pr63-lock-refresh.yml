name: PR63 Lock Refresh

on:
  push:
    branches:
      - agent/rpa-shared-vectors
    paths:
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'src-tauri/Cargo.toml'
      - 'package.json'
      - '.github/workflows/pr63-lock-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr63-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'CyberAshven/OPTNWallet'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/rpa-shared-vectors
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.0

      - name: Regenerate exact lockfiles
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          (
            cd src-tauri
            cargo update -p tauri --precise 2.11.5
          )

      - name: Commit generated lockfiles
        run: |
          set -euo pipefail
          git add Cargo.lock package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo 'Lockfiles already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh generated lockfiles'
          git push origin HEAD:agent/rpa-shared-vectors
