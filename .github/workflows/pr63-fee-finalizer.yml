name: PR63 fee integration finalizer

on:
  push:
    branches: [agent/rpa-shared-vectors]
    paths:
      - .github/workflows/pr63-fee-finalizer.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.repository == 'CyberAshven/OPTNWallet'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/rpa-shared-vectors
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          targets: wasm32-unknown-unknown
      - name: Apply fee-policy integration
        shell: python
        run: |
          from pathlib import Path

          def rep(path, old, new):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{path}: expected one match, got {n}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          app = 'crates/optn-app/src/lib.rs'
          rep(app, 'pub use optn_core::fee::{FeeRate, RELAY_MINIMUM_FEE_RATE};',
              'pub use optn_core::fee::{\n    FeeMode, FeePreferences, FeeRate, DEFAULT_CUSTOM_FEE_RATE, RELAY_MINIMUM_FEE_RATE,\n};')
          rep(app, '    pub wallet: Option<OpenedWallet>,\n    pub spend: Option<SpendPlan>,\n    /// The connected device, if any.',
              '    pub wallet: Option<OpenedWallet>,\n    pub spend: Option<SpendPlan>,\n    /// App-wide fee policy. Providers may advise Auto, but never own this preference.\n    pub fee_preferences: FeePreferences,\n    /// The connected device, if any.')
          rep(app, '            wallet: None,\n            spend: None,\n            hardware: HardwareSessionState::new(),',
              '            wallet: None,\n            spend: None,\n            fee_preferences: FeePreferences::app_default(),\n            hardware: HardwareSessionState::new(),')
          rep(app, '    SetTheme(ThemeMode),\n    SetSkin(UiSkin),\n    SetNetwork(Network),',
              '    SetTheme(ThemeMode),\n    SetSkin(UiSkin),\n    SetFeeMode(FeeMode),\n    SetCustomFeeRate(FeeRate),\n    SetNetwork(Network),')
          rep(app, '    ThemeChanged(ThemeMode),\n    SkinChanged(UiSkin),\n    NetworkChanged(Network),',
              '    ThemeChanged(ThemeMode),\n    SkinChanged(UiSkin),\n    FeePreferencesChanged(FeePreferences),\n    NetworkChanged(Network),')
          rep(app, '            AppAction::SetSkin(skin) if self.skin != skin => {\n                self.skin = skin;\n                Some(AppEvent::SkinChanged(skin))\n            }\n            AppAction::SetNetwork(network) if self.network != network => {',
              '            AppAction::SetSkin(skin) if self.skin != skin => {\n                self.skin = skin;\n                Some(AppEvent::SkinChanged(skin))\n            }\n            AppAction::SetFeeMode(mode) if self.fee_preferences.mode != mode => {\n                self.fee_preferences.mode = mode;\n                Some(AppEvent::FeePreferencesChanged(self.fee_preferences))\n            }\n            AppAction::SetCustomFeeRate(rate) if self.fee_preferences.custom_rate != rate => {\n                self.fee_preferences.custom_rate = rate;\n                Some(AppEvent::FeePreferencesChanged(self.fee_preferences))\n            }\n            AppAction::SetNetwork(network) if self.network != network => {')
          rep(app, '                match prepare_spend_with(\n                    &self.coins,\n                    self.network,\n                    &destination,\n                    amount_sats,\n                    wallet.spending_capability(),\n                    coin,\n                ) {',
              '                let fee_rate = self.fee_preferences.resolve(\n                    RELAY_MINIMUM_FEE_RATE,\n                    RELAY_MINIMUM_FEE_RATE,\n                );\n                match prepare_spend_with_fee_and_coin(\n                    &self.coins,\n                    self.network,\n                    &destination,\n                    amount_sats,\n                    wallet.spending_capability(),\n                    fee_rate,\n                    coin,\n                ) {')
          rep(app, '            AppAction::SetNetwork(_)\n            | AppAction::SetTheme(_)\n            | AppAction::SetSkin(_)\n            | AppAction::OpenHelp',
              '            AppAction::SetNetwork(_)\n            | AppAction::SetTheme(_)\n            | AppAction::SetSkin(_)\n            | AppAction::SetFeeMode(_)\n            | AppAction::SetCustomFeeRate(_)\n            | AppAction::OpenHelp')
          with Path(app).open('a') as f:
              f.write('''\n\n#[cfg(test)]\nmod fee_policy_integration_regression {\n    use super::*;\n    #[test]\n    fn app_fee_policy_is_resolved_before_spend_planning_and_clamped() {\n        let mut state = AppState::default();\n        assert_eq!(state.fee_preferences, FeePreferences::app_default());\n        state.reduce(AppAction::SetFeeMode(FeeMode::Custom));\n        state.reduce(AppAction::SetCustomFeeRate(FeeRate::from_satoshis_per_kb(500)));\n        assert_eq!(state.fee_preferences.resolve(RELAY_MINIMUM_FEE_RATE, RELAY_MINIMUM_FEE_RATE), RELAY_MINIMUM_FEE_RATE);\n        state.reduce(AppAction::SetCustomFeeRate(FeeRate::from_satoshis_per_kb(1700)));\n        assert_eq!(state.fee_preferences.custom_rate.satoshis_per_kb(), 1700);\n    }\n}\n''')

          transport = 'crates/optn-transport/src/lib.rs'
          rep(transport, '    FeatureFlags, FeeRate, FlipstarterPledge, FreezeReason, HardwareSessionState,',
              '    FeatureFlags, FeeMode, FeePreferences, FeeRate, FlipstarterPledge, FreezeReason, HardwareSessionState,')
          rep(transport, '#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\npub enum WireSurface {',
              '#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize, Default)]\n#[serde(rename_all = "snake_case")]\npub enum WireFeeMode {\n    #[default]\n    Auto,\n    Custom,\n}\n\nimpl From<FeeMode> for WireFeeMode {\n    fn from(value: FeeMode) -> Self { match value { FeeMode::Auto => Self::Auto, FeeMode::Custom => Self::Custom } }\n}\nimpl From<WireFeeMode> for FeeMode {\n    fn from(value: WireFeeMode) -> Self { match value { WireFeeMode::Auto => Self::Auto, WireFeeMode::Custom => Self::Custom } }\n}\n\n#[derive(Debug, Clone, Copy, PartialEq, Eq, Serialize, Deserialize)]\n#[serde(rename_all = "snake_case")]\npub enum WireSurface {')
          rep(transport, '    SetTheme(WireTheme),\n    SetSkin(WireSkin),\n    SetNetwork(WireNetwork),',
              '    SetTheme(WireTheme),\n    SetSkin(WireSkin),\n    SetFeeMode(WireFeeMode),\n    SetCustomFeeRate { satoshis_per_kb: u64 },\n    SetNetwork(WireNetwork),')
          rep(transport, '    #[serde(default)]\n    pub skin: WireSkin,\n    pub network: WireNetwork,\n    pub help_open: bool,',
              '    #[serde(default)]\n    pub skin: WireSkin,\n    pub network: WireNetwork,\n    #[serde(default)]\n    pub fee_mode: WireFeeMode,\n    #[serde(default = "default_custom_fee_rate_sat_per_kb")]\n    pub custom_fee_satoshis_per_kb: u64,\n    pub help_open: bool,')
          rep(transport, 'fn default_relay_fee_rate_sat_per_kb() -> u64 {\n    RELAY_MINIMUM_FEE_RATE.satoshis_per_kb()\n}',
              'fn default_relay_fee_rate_sat_per_kb() -> u64 {\n    RELAY_MINIMUM_FEE_RATE.satoshis_per_kb()\n}\n\nfn default_custom_fee_rate_sat_per_kb() -> u64 {\n    optn_app::DEFAULT_CUSTOM_FEE_RATE.satoshis_per_kb()\n}')
          rep(transport, '            AppAction::SetTheme(theme) => WireActionKind::SetTheme(theme.into()),\n            AppAction::SetSkin(skin) => WireActionKind::SetSkin(skin.into()),\n            AppAction::SetNetwork(network) => WireActionKind::SetNetwork(network.into()),',
              '            AppAction::SetTheme(theme) => WireActionKind::SetTheme(theme.into()),\n            AppAction::SetSkin(skin) => WireActionKind::SetSkin(skin.into()),\n            AppAction::SetFeeMode(mode) => WireActionKind::SetFeeMode(mode.into()),\n            AppAction::SetCustomFeeRate(rate) => WireActionKind::SetCustomFeeRate { satoshis_per_kb: rate.satoshis_per_kb() },\n            AppAction::SetNetwork(network) => WireActionKind::SetNetwork(network.into()),')
          rep(transport, '            WireActionKind::SetTheme(theme) => Self::SetTheme(theme.into()),\n            WireActionKind::SetSkin(skin) => Self::SetSkin(skin.into()),\n            WireActionKind::SetNetwork(network) => Self::SetNetwork(network.into()),',
              '            WireActionKind::SetTheme(theme) => Self::SetTheme(theme.into()),\n            WireActionKind::SetSkin(skin) => Self::SetSkin(skin.into()),\n            WireActionKind::SetFeeMode(mode) => Self::SetFeeMode(mode.into()),\n            WireActionKind::SetCustomFeeRate { satoshis_per_kb } => Self::SetCustomFeeRate(FeeRate::from_satoshis_per_kb(satoshis_per_kb)),\n            WireActionKind::SetNetwork(network) => Self::SetNetwork(network.into()),')
          rep(transport, '    SkinChanged(WireSkin),\n    NetworkChanged(WireNetwork),',
              '    SkinChanged(WireSkin),\n    FeePreferencesChanged { mode: WireFeeMode, custom_fee_satoshis_per_kb: u64 },\n    NetworkChanged(WireNetwork),')
          rep(transport, '            skin: value.skin.into(),\n            network: value.network.into(),\n            help_open: value.help_open,\n            surface: value.surface.into(),',
              '            skin: value.skin.into(),\n            network: value.network.into(),\n            fee_mode: value.fee_preferences.mode.into(),\n            custom_fee_satoshis_per_kb: value.fee_preferences.custom_rate.satoshis_per_kb(),\n            help_open: value.help_open,\n            surface: value.surface.into(),')
          rep(transport, '            skin: value.skin.into(),\n            network: value.network.into(),\n            help_open: value.help_open,\n            surface: value.surface.into(),\n            features:',
              '            skin: value.skin.into(),\n            network: value.network.into(),\n            fee_preferences: FeePreferences::new(value.fee_mode.into(), FeeRate::from_satoshis_per_kb(value.custom_fee_satoshis_per_kb)),\n            help_open: value.help_open,\n            surface: value.surface.into(),\n            features:')
          rep(transport, '            AppEvent::ThemeChanged(theme) => WireEventKind::ThemeChanged(theme.into()),\n            AppEvent::SkinChanged(skin) => WireEventKind::SkinChanged(skin.into()),\n            AppEvent::NetworkChanged(network) => WireEventKind::NetworkChanged(network.into()),',
              '            AppEvent::ThemeChanged(theme) => WireEventKind::ThemeChanged(theme.into()),\n            AppEvent::SkinChanged(skin) => WireEventKind::SkinChanged(skin.into()),\n            AppEvent::FeePreferencesChanged(prefs) => WireEventKind::FeePreferencesChanged { mode: prefs.mode.into(), custom_fee_satoshis_per_kb: prefs.custom_rate.satoshis_per_kb() },\n            AppEvent::NetworkChanged(network) => WireEventKind::NetworkChanged(network.into()),')
          rep(transport, '            WireEventKind::ThemeChanged(theme) => Self::ThemeChanged(theme.into()),\n            WireEventKind::SkinChanged(skin) => Self::SkinChanged(skin.into()),\n            WireEventKind::NetworkChanged(network) => Self::NetworkChanged(network.into()),',
              '            WireEventKind::ThemeChanged(theme) => Self::ThemeChanged(theme.into()),\n            WireEventKind::SkinChanged(skin) => Self::SkinChanged(skin.into()),\n            WireEventKind::FeePreferencesChanged { mode, custom_fee_satoshis_per_kb } => Self::FeePreferencesChanged(FeePreferences::new(mode.into(), FeeRate::from_satoshis_per_kb(custom_fee_satoshis_per_kb))),\n            WireEventKind::NetworkChanged(network) => Self::NetworkChanged(network.into()),')

      - name: Format
        run: cargo fmt --all
      - name: Test Rust workspace
        run: cargo test --workspace --all-targets
      - name: Check Leptos WASM renderer
        run: cargo check -p optn-ui --target wasm32-unknown-unknown
      - name: Commit validated permanent changes
        shell: bash
        run: |
          rm .github/workflows/pr63-fee-finalizer.yml
          git add -A
          git config user.name "PR63 validation bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "feat(app): make fee preferences authoritative end to end"
          git push origin HEAD:agent/rpa-shared-vectors
