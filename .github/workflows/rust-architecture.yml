name: Rust architecture

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-architecture:
    name: Rust architecture and Leptos WASM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: '. -> target'

      - name: Framework boundary
        run: cargo run -p xtask -- architecture

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy framework-neutral crates
        run: cargo clippy -p optn-app -p optn-platform -p optn-transport -p optn-runtime -p optn-transport-tauri -p xtask --all-targets -- -D warnings

      - name: Test application platform and transport contracts
        run: cargo test -p optn-app -p optn-platform -p optn-transport -p optn-runtime -p optn-transport-tauri -p xtask

      - name: Compile Leptos UI to WASM
        run: cargo check -p optn-ui --target wasm32-unknown-unknown

      - name: Compile Tauri-hosted Leptos transport to WASM
        run: cargo check -p optn-ui --target wasm32-unknown-unknown --features tauri-transport

      - name: Install pinned Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Build production Leptos bundle
        working-directory: crates/optn-ui
        run: trunk build --release --config Trunk.toml

      - name: Verify Leptos bundle
        run: |
          test -s crates/optn-ui/dist/index.html
          find crates/optn-ui/dist -maxdepth 1 -type f -name '*.wasm' -size +0c -print -quit | grep -q .

      - name: Build Tauri-hosted Leptos bundle
        working-directory: crates/optn-ui
        run: trunk build --release --config Trunk.tauri.toml

      - name: Verify Tauri-hosted bundle uses host snapshots
        run: |
          python3 - <<'PY'
          from pathlib import Path
          dist = Path("crates/optn-ui/dist")
          blob = b"".join(path.read_bytes() for path in dist.rglob("*") if path.is_file())
          if b"optn_app_snapshot" not in blob:
              raise SystemExit(
                  "Tauri Leptos bundle is missing optn_app_snapshot; tauri-transport was not compiled in"
              )
          print("tauri-transport snapshot command present")
          PY
