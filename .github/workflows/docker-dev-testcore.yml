# One-shot / optional: pull lab image and run npm test:core (simulates compose + test)
name: Docker dev test:core

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Full image ref to pull'
        required: true
        default: 'ghcr.io/optnlabs/optn-docker-dev:latest'

permissions:
  contents: read
  packages: read

jobs:
  testcore:
    name: test:core in lab image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^[A-Za-z0-9./_:@-]+$ ]]; then
            echo 'Invalid image reference.' >&2
            exit 2
          fi
          docker pull "$IMAGE"

      - name: npm ci + test:core inside container
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE" =~ ^[A-Za-z0-9./_:@-]+$ ]]; then
            echo 'Invalid image reference.' >&2
            exit 2
          fi
          # Host checkout is root-owned; chown for image user `node` (uid 1000)
          # before npm writes node_modules (same as real compose bind-mount care).
          sudo chown -R 1000:1000 "$PWD"
          docker run --rm \
            --user 1000:1000 \
            -v "$PWD":/optn \
            -w /optn \
            -e CI=true \
            -e HOME=/tmp \
            -e npm_config_cache=/tmp/npm-cache \
            "$IMAGE" \
            bash -lc 'npm ci && npm run test:core'
