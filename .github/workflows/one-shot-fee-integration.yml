name: One-shot fee integration

on:
  push:
    branches:
      - agent/rpa-shared-vectors

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: contains(github.event.head_commit.message, 'activate deterministic fee integration patch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/rpa-shared-vectors
          fetch-depth: 0

      - name: Install wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Write permanent app, transport, and UI integration
        run: python .github/scripts/finalize_fee_sources.py

      - name: Format product Rust
        run: cargo fmt --all

      - name: Validate application state and spend policy
        run: cargo test -p optn-app --lib

      - name: Validate wire round trips
        run: cargo test -p optn-transport --lib

      - name: Validate Leptos settings target
        run: cargo check -p optn-ui --target wasm32-unknown-unknown

      - name: Validate full Rust workspace
        run: cargo test --workspace --all-targets

      - name: Ensure clean patch syntax
        run: git diff --check

      - name: Commit only validated permanent product changes
        run: |
          git rm .github/workflows/one-shot-fee-integration.yml \
            .github/scripts/apply_fee_integration.py \
            .github/scripts/apply_fee_transport.py \
            .github/scripts/finalize_fee_sources.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/optn-app/src/lib.rs crates/optn-app/src/servers.rs \
            crates/optn-transport/src/lib.rs crates/optn-ui/src/settings.rs
          git commit -m "feat(app): wire fee policy and source-oriented settings end to end"
          git push origin HEAD:agent/rpa-shared-vectors
