name: One-shot fee integration

on:
  push:
    branches:
      - agent/rpa-shared-vectors

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: contains(github.event.head_commit.message, 'activate deterministic fee integration patch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rpa-shared-vectors
          fetch-depth: 0
      - run: rustup target add wasm32-unknown-unknown
      - run: python .github/scripts/finalize_fee_sources.py
      - run: cargo fmt --all
      - run: cargo test -p optn-app --lib
      - run: cargo test -p optn-transport --lib
      - run: cargo check -p optn-ui --target wasm32-unknown-unknown
      - run: cargo test --workspace --all-targets
      - run: git diff --check
      - name: Commit validated permanent sources
        run: |
          git rm .github/workflows/one-shot-fee-integration.yml .github/scripts/apply_fee_integration.py .github/scripts/apply_fee_transport.py .github/scripts/finalize_fee_sources.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/optn-app/src/lib.rs crates/optn-app/src/servers.rs crates/optn-transport/src/lib.rs crates/optn-ui/src/settings.rs
          git commit -m "feat(app): wire fee policy and source-oriented settings end to end"
          git push origin HEAD:agent/rpa-shared-vectors
