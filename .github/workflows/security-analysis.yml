name: Security analysis

on:
  pull_request:
  push:
    branches: [main, staging, dev]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    name: Semgrep CE
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Scan source
        run: >-
          semgrep scan --config auto --error
          --exclude 'docs/translations/**'
          --exclude 'src/i18n/**'
          --exclude 'src/pages/apps/fundme/**'
          --exclude 'src/pages/apps/FundMe.tsx'
          --exclude 'android/app/src/main/AndroidManifest.xml'

  cargo-audit:
    name: Rust dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.98.0

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: './src-tauri -> target'

      # Built from source rather than pulled as a prebuilt action: this is the
      # job that guards the dependency tree, so it should not add a new trusted
      # third party to do it.
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The npm graph is covered by "Supply-chain policy and SBOM"; nothing
      # audited the Rust graph at all until now, which is 6k lines of Rust and
      # a large transitive tree.
      #
      # The ignore list is a baseline, not a dismissal: these four already exist
      # on dev, so failing on them would only make this job permanently red and
      # teach everyone to ignore it. New advisories still fail the build. Drop
      # each entry as its fix lands.
      #
      #   RUSTSEC-2026-0194  quick-xml <0.41   quadratic parse on duplicate attrs
      #   RUSTSEC-2026-0195  quick-xml <0.41   unbounded namespace allocation
      #   RUSTSEC-2026-0185  quinn-proto 0.11.14  out-of-order reassembly DoS
      #   RUSTSEC-2026-0235  rkyv 0.7.46       OOB read on Rc/Arc archives
      #
      # quick-xml and quinn-proto are availability-only. RUSTSEC-2026-0235 is
      # not: an out-of-bounds read can disclose adjacent memory, so it is a
      # confidentiality issue and the more urgent of the four to clear.
      # quinn-proto is already handled by the open bump to 0.11.17.
      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo audit \
            --ignore RUSTSEC-2026-0194 \
            --ignore RUSTSEC-2026-0195 \
            --ignore RUSTSEC-2026-0185 \
            --ignore RUSTSEC-2026-0235

  supply-chain:
    name: Supply-chain policy and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - name: Install production dependency graph
        run: npm ci --ignore-scripts

      - name: Dependency policy
        run: npm run deps:check

      - name: License policy
        run: npm run licenses:check

      # Dev/e2e pulls unfixed extract-zip via @puppeteer/browsers (wdio).
      # That is CI-only; the production graph is what this job installed.
      - name: High-severity dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          format: cyclonedx-json
          output-file: optn-wallet-sbom.cdx.json
          artifact-name: optn-wallet-sbom
          upload-artifact: true
          upload-artifact-retention: 30
          upload-release-assets: false
