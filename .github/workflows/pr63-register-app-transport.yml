name: PR63 Register App Transport

on:
  push:
    branches:
      - agent/rpa-shared-vectors
    paths:
      - 'src-tauri/src/app_transport.rs'
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/pr63-register-app-transport.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr63-register-app-transport
  cancel-in-progress: false

jobs:
  register:
    if: github.repository == 'CyberAshven/OPTNWallet'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: agent/rpa-shared-vectors
          persist-credentials: true

      - name: Register transport module and commands
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src-tauri/src/lib.rs')
          text = path.read_text()

          module_anchor = 'mod menu;\n\n'
          module_line = 'pub mod app_transport;\n'
          if module_line not in text:
              if module_anchor not in text:
                  raise SystemExit('module anchor not found')
              text = text.replace(module_anchor, module_anchor + module_line, 1)

          command_anchor = '        .invoke_handler(tauri::generate_handler![\n'
          command_lines = (
              '            app_transport::optn_app_dispatch,\n'
              '            app_transport::optn_app_snapshot,\n'
          )
          if 'app_transport::optn_app_dispatch' not in text:
              if command_anchor not in text:
                  raise SystemExit('invoke handler anchor not found')
              text = text.replace(command_anchor, command_anchor + command_lines, 1)

          path.write_text(text)
          PY

      - name: Commit registration
        run: |
          set -euo pipefail
          git add src-tauri/src/lib.rs
          if git diff --cached --quiet; then
            echo 'App transport already registered.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(transport): register Tauri app runtime bridge'
          git push origin HEAD:agent/rpa-shared-vectors
