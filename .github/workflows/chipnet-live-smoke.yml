name: Chipnet Live Smoke

on:
  push:
    branches:
      - agent/rpa-shared-vectors
    paths:
      - '.github/workflows/chipnet-live-smoke.yml'
      - 'scripts/seedcash/**'
      - 'src/services/psbt/**'
      - 'src/services/RpaService.ts'
      - 'src/services/RpaSender.ts'
      - 'src/services/RpaDetect.ts'
      - 'src/services/__tests__/rpaChipnet.live.test.ts'
      - 'src/wasm/optn-core/**'
      - 'crates/optn-core/src/rpa.rs'
      - 'test-support/chipnetElectrum.ts'
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: chipnet-live-smoke
  cancel-in-progress: false

env:
  SEEDCASH_REPOSITORY: SeedCashOrg/seedcash
  SEEDCASH_REVISION: beb33222e47f52937bc139f2f2dbb727c8179b39

jobs:
  seedcash-chipnet:
    name: SeedCash PSBT and Chipnet broadcast
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout OPTN
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Checkout pinned SeedCash signer
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout             "https://github.com/${SEEDCASH_REPOSITORY}.git" "$RUNNER_TEMP/seedcash"
          git -C "$RUNNER_TEMP/seedcash" checkout --detach "$SEEDCASH_REVISION"
          test "$(git -C "$RUNNER_TEMP/seedcash" rev-parse HEAD)" = "$SEEDCASH_REVISION"
          echo "SEEDCASH_SRC=$RUNNER_TEMP/seedcash/src" >> "$GITHUB_ENV"

      - name: Install SeedCash signer dependencies
        run: |
          python -m pip install --disable-pip-version-check             'base58==2.1.1'             'ecdsa==0.19.1'

      - name: Prove pinned signer imports
        run: python scripts/seedcash/sign_psbt.py keys

      - name: SeedCash PSBT interoperability
        env:
          RUN_SEEDCASH_LIVE: '1'
        run: |
          npx vitest run             src/services/psbt/__tests__/seedcashRoundtrip.test.ts             src/services/psbt/__tests__/seedcashUrRoundtrip.test.ts             src/services/psbt/__tests__/seedcashMultisigRoundtrip.test.ts             --testTimeout=120000

      - name: Live Chipnet watch-only self-send
        run: npx tsx scripts/seedcash/e2e_chipnet_watchonly.mts

  rpa-chipnet:
    name: RPA pay scan and sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_RPA_LIVE: '1'
      RPA_LIVE_MNEMONIC: 'abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about'
      RPA_LIVE_SATS: '20000'
      RPA_LIVE_GAP: '5'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify shipped Rust WASM vectors
        run: npx vitest run src/wasm/optn-core/__tests__/optnCore.verify.test.ts --testTimeout=60000

      - name: Live RPA payment, scan, key derivation and sweep
        run: npx vitest run src/services/__tests__/rpaChipnet.live.test.ts --testTimeout=900000

  public-chipnet:
    name: Public Chipnet services
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Live Cauldron indexer smoke
        env:
          RUN_CAULDRON_LIVE: '1'
        run: npx vitest run src/services/__tests__/cauldron.live.test.ts --testTimeout=60000
