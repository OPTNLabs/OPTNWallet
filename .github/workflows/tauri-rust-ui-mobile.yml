name: Tauri Rust UI Mobile

on:
  pull_request:
    branches: [dev, staging, main]
    paths:
      - 'Cargo.toml'
      - 'rust-toolchain.toml'
      - 'crates/optn-app/**'
      - 'crates/optn-platform/**'
      - 'crates/optn-runtime/**'
      - 'crates/optn-ui/**'
      - 'src-tauri/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/tauri-rust-ui-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-rust-ui-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Tauri Leptos Android
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699

      - name: Install pinned Android SDK and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install             'platform-tools'             'platforms;android-36'             'build-tools;37.0.0'             'ndk;27.2.12479018'
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install pinned Rust and targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown,aarch64-linux-android
          components: rustfmt,clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            '. -> target'
            './src-tauri -> target'

      - name: Install pinned Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Initialize Tauri Android
        run: npx tauri android init --ci --skip-targets-install --config src-tauri/tauri.leptos.mobile.conf.json

      - name: Build Tauri Leptos Android APK
        run: npx tauri android build --debug --apk --target aarch64 --config src-tauri/tauri.leptos.mobile.conf.json

      - name: Verify APK
        run: |
          APK="$(find src-tauri/gen/android -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          echo "Tauri Android APK: $APK"

  ios:
    name: Tauri Leptos iOS
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install pinned Rust and targets
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.0
          targets: wasm32-unknown-unknown,aarch64-apple-ios-sim
          components: rustfmt,clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: |
            '. -> target'
            './src-tauri -> target'

      - name: Install pinned Trunk
        run: cargo install trunk --version 0.21.14 --locked

      - name: Initialize Tauri iOS
        run: npx tauri ios init --ci --config src-tauri/tauri.leptos.mobile.conf.json

      - name: Build Tauri Leptos iOS simulator
        run: npx tauri ios build --debug --target aarch64-sim --ci --config src-tauri/tauri.leptos.mobile.conf.json

      - name: Verify iOS simulator app
        run: |
          APP="$(find src-tauri/gen/apple -type d -name '*.app' -print -quit)"
          test -n "$APP"
          test -d "$APP"
          echo "Tauri iOS simulator app: $APP"
