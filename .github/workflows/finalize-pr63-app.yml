name: Finalize PR63 app integration

on:
  push:
    branches:
      - agent/rpa-shared-vectors

permissions:
  contents: write

jobs:
  validate-and-land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rpa-shared-vectors
          fetch-depth: 0

      - name: Install WASM target
        run: rustup target add wasm32-unknown-unknown

      - name: Apply permanent app/source integration
        run: |
          python .github/scripts/finalize_fee_sources.py
          python - <<'PY'
          from pathlib import Path

          ui = Path('crates/optn-ui/src/settings.rs')
          text = ui.read_text()
          old = 'vm.network.label()'
          if old not in text:
              raise SystemExit('expected generated Network.label() call not found')
          ui.write_text(text.replace(old, 'network_copy(vm.network).0', 1))

          servers = Path('crates/optn-app/src/servers.rs')
          text = servers.read_text()
          text = text.replace('ServerKind::Peer => "Node (BIP37)"', 'ServerKind::Peer => "BCH node / P2P"')
          text = text.replace('ServerKind::Electrum => "Fulcrum (Electrum)"', 'ServerKind::Electrum => "Electrum / Fulcrum"')
          text = text.replace(
              '"host:port for a BCH P2P node with NODE_BLOOM"',
              '"host:port for a BCH P2P node; capabilities are probed after connection"',
          )
          servers.write_text(text)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Validate app model
        run: cargo test -p optn-app --lib

      - name: Validate transport
        run: cargo test -p optn-transport --lib

      - name: Validate Leptos WASM
        run: cargo check -p optn-ui --target wasm32-unknown-unknown

      - name: Validate complete Rust workspace
        run: cargo test --workspace --all-targets

      - name: Validate patch
        run: git diff --check

      - name: Commit validated permanent sources
        run: |
          git rm .github/workflows/finalize-pr63-app.yml .github/scripts/finalize_fee_sources.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/optn-app/src/lib.rs crates/optn-app/src/servers.rs crates/optn-transport/src/lib.rs crates/optn-ui/src/settings.rs
          git commit -m "feat(app): wire fee policy and source-oriented settings end to end"
          git push origin HEAD:agent/rpa-shared-vectors
