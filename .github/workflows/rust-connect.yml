name: Shared Rust connectors

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Shared Rust connector core
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.98.0'
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './crates/optn-core -> target'
      - run: npm ci
      - name: Reject stale committed WASM
        run: npx --no-install tsx scripts/build-optn-core-wasm.mts --check
      - name: Native Rust validation
        working-directory: crates/optn-core
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Check committed WASM against the connector and BCH VM tests
        run: npx --no-install vitest run src/services/connect/__tests__/ConnectSigningCore.test.ts src/services/wizardconnect/__tests__/signing.test.ts src/services/cashconnect/__tests__/cashconnectLibauth.test.ts src/redux/walletconnect/__tests__/signing.rust.test.ts
      - name: Install matching binding generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Rebuild WASM from Rust
        run: npx --no-install tsx scripts/build-optn-core-wasm.mts
      - name: Verify rebuilt WASM and bindings
        run: |
          npx --no-install tsx scripts/build-optn-core-wasm.mts --check
          npx --no-install vitest run src/services/connect/__tests__/ConnectSigningCore.test.ts src/services/wizardconnect/__tests__/signing.test.ts src/services/cashconnect/__tests__/cashconnectLibauth.test.ts src/redux/walletconnect/__tests__/signing.rust.test.ts
