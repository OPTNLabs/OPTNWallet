name: CI
on:
  pull_request:
  push:
    branches: [main, staging, dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Probe the dependency graph itself rather than the settings field.
      # `security_and_analysis.dependency_graph` is only returned for repos where
      # the graph is configurable — on a public repo it is always on and the field
      # is absent, so the old `// "disabled"` fallback made this job skip on every
      # PR while still reporting success. The SBOM endpoint answers the question
      # that actually matters: can dependency-review read a graph or not.
      - name: Check dependency-graph availability
        id: dependency-graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Distinguish "the graph is off" from "the probe itself failed".
          # Treating every non-zero exit as disabled would silently skip
          # dependency review on a transient network error or an auth problem,
          # which is the same green-but-checking-nothing failure this job was
          # fixed to stop.
          # 200/403/404 are answers and are taken immediately. A 5xx or an empty
          # reply is not an answer, it is the API having a bad moment, so retry
          # before deciding. Failing closed on the first blip turns a transient
          # outage into a red pull request someone has to re-run by hand -- #56
          # was blocked by exactly one 500.
          status=''
          attempt=1
          max=3
          while true; do
            code="$(gh api "repos/${{ github.repository }}/dependency-graph/sbom" \
              --silent --include 2>/dev/null | head -1 | grep -oE '[0-9]{3}' || true)"
            case "$code" in
              200)
                status=enabled
                break
                ;;
              403|404)
                # Not enabled, or not visible to this token: a real answer.
                status=disabled
                break
                ;;
            esac
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::dependency-graph probe returned '${code:-no status}' on ${max} attempts; refusing to guess whether the graph is available"
              exit 1
            fi
            echo "::warning::dependency-graph probe returned '${code:-no status}' (attempt ${attempt}/${max}); retrying"
            sleep $((attempt * 5))
            attempt=$((attempt + 1))
          done
          echo "Dependency graph: $status (HTTP ${code})"
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # GitHub keeps hand-submitted dependency snapshots forever. When the base
      # commit carries one and the head has only GitHub's own static graph, the
      # comparison is incomplete: the snapshot's packages read as removed, and
      # changes go unreviewed. That comparison is never the only one trusted.
      # Starting at the base, walk back to the nearest ancestor whose comparison
      # with the head is complete. The review then runs from both, so nothing
      # this pull request adds escapes either: the real base catches packages it
      # re-adds, and the complete base catches everything the graph could not
      # see. With no complete ancestor within 20 commits, the job still fails.
      - name: Choose a base with a complete dependency graph
        id: review-base
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          base="$BASE_SHA"
          for _ in $(seq 20); do
            curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
              --dump-header "$headers" --output /dev/null \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/compare/$base...$HEAD_SHA?per_page=5"
            warning="$(awk 'tolower($1) == "x-github-dependency-graph-snapshot-warnings:" { sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); value = $0 } END { print value }' "$headers")"
            if [[ -z "$warning" ]]; then
              if [[ "$base" == "$BASE_SHA" ]]; then
                echo "Dependency graph has complete snapshots for the PR base and head."
              else
                echo "::notice::The PR base carries dependency snapshots its head lacks; also reviewing from ancestor $base, whose comparison is complete and covers this pull request's changes and more."
              fi
              echo "sha=$base" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            detail="$(printf '%s' "$warning" | base64 --decode 2>/dev/null || true)"
            echo "::warning::Comparison from $base is incomplete: ${detail:-$warning}"
            base="$(gh api "repos/$GITHUB_REPOSITORY/commits/$base" --jq '.parents[0].sha')"
            [[ "$base" =~ ^[0-9a-f]{40}$ ]] || break
          done
          echo "::error::No ancestor of $BASE_SHA within 20 commits has a complete dependency comparison with $HEAD_SHA"
          exit 1
      # GHSA-hc3c-63hc-2r9f (RUSTSEC-2026-0124) is in libcrux-chacha20poly1305,
      # part of hpke-rs's optional libcrux backend. MDK's OpenMLS provider
      # (optn-chat) uses hpke-rs's RustCrypto backend, and nothing enables the
      # libcrux one: it is in Cargo.lock only because Cargo records optional
      # dependencies too, and no build compiles it. The same case is in
      # deny.toml's notes and src-tauri/.cargo/audit.toml. Remove when
      # openmls_rust_crypto moves to an hpke-rs on fixed libcrux releases.
      - name: Dependency review
        if: steps.dependency-graph.outputs.status == 'enabled'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          allow-ghsas: GHSA-hc3c-63hc-2r9f
      - name: Dependency review from the complete base
        if: steps.dependency-graph.outputs.status == 'enabled' && steps.review-base.outputs.sha != github.event.pull_request.base.sha
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48
        with:
          base-ref: ${{ steps.review-base.outputs.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}
          allow-ghsas: GHSA-hc3c-63hc-2r9f
      - name: Skip dependency review
        if: steps.dependency-graph.outputs.status != 'enabled'
        run: echo "Dependency graph is disabled; skipping dependency review."

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Gitleaks scan
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/path:ro" \
            -w /path \
            ghcr.io/gitleaks/gitleaks@sha256:b5918eb91b8d2473cec722f066abb4352e4ffdc4ec9f4283ec143aba9ec9ebc4 \
            git --redact --config .gitleaks.toml --log-opts="--all" .

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install deps
        run: |
          for attempt in 1 2 3; do
            if npm ci; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm ci attempt $attempt failed; retrying"
              sleep $((attempt * 10))
            fi
          done
          exit 1

      - name: Dependency policy
        run: npm run deps:check
      - name: Dependency security regressions
        run: npx vitest run scripts/__tests__/dependencySecurity.test.mts
      - name: Dependency audit (prod, critical+)
        run: npm audit --omit=dev --audit-level=critical
      - name: Dependency audit (all, high+)
        run: npm run security:audit:all

  web-ci:
    needs: [secrets-scan, dependency-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Canonical quality gate
        uses: ./.github/actions/quality-gate
        with:
          node-version: '22.23.2'
          run-build: 'true'

      - name: Upload web dist
        if: github.event_name == 'push' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: web-dist
          path: dist/
          retention-days: 7

  release-completeness:
    name: Assets completeness
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pyyaml
      # The release asserts its own asset set, but nothing asserted the
      # assertion. A pattern with a typo, or a guard broad enough to accept
      # anything, looks correct in review and removes the protection entirely.
      # This runs the workflow's own shell against a synthetic release and
      # removes one asset at a time, requiring every removal to be caught.
      - run: bash scripts/verify-release-completeness.sh
      - run: python scripts/verify-preview-completeness.py
