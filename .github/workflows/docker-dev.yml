# Production-grade publish path for the *lab* image (not the consumer wallet).
# This workflow only runs on trusted pushes, tags, and manual dispatches. Pull
# requests use docker-dev-pr.yml, which has read-only permissions and never
# publishes to GHCR or requests an OIDC token.

name: Docker dev image

on:
  push:
    branches:
      - dev
      - main
    paths:
      - 'packages/docker-dev/**'
      - '.github/workflows/docker-dev.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push image to GHCR (true/false)'
        required: true
        default: 'false'
      platforms:
        description: 'Platforms (push only; PR smoke is linux/amd64)'
        required: false
        default: 'linux/amd64,linux/arm64'

env:
  IMAGE_NAME: optn-docker-dev

concurrency:
  group: docker-dev-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docker-dev
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up QEMU
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.push == 'true')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Decide whether to push
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          PUSH=false
          PLATFORMS="linux/amd64"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$INPUT_PUSH" == "true" ]]; then
              PUSH=true
              PLATFORMS="$INPUT_PLATFORMS"
            fi
          elif [[ "$REF_TYPE" == "tag" ]]; then
            PUSH=true
            PLATFORMS="linux/amd64,linux/arm64"
          fi
          echo "push=${PUSH}" >> "$GITHUB_OUTPUT"
          echo "platforms=${PLATFORMS}" >> "$GITHUB_OUTPUT"

          OWNER_LC="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${OWNER_LC}" >> "$GITHUB_OUTPUT"

          if [[ "$REF_TYPE" == "tag" ]]; then
            RAW="$REF_NAME"
            STRIPPED="${RAW#v}"
            echo "version_tag=${RAW}" >> "$GITHUB_OUTPUT"
            echo "version_stripped=${STRIPPED}" >> "$GITHUB_OUTPUT"
          else
            SHORT="sha-${GITHUB_SHA::7}"
            echo "version_tag=${SHORT}" >> "$GITHUB_OUTPUT"
            echo "version_stripped=${SHORT}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker_meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ghcr.io/${{ steps.meta.outputs.owner_lc }}/${{ env.IMAGE_NAME }}
          # Version tags only. `latest` is a mutable pointer with no identity:
          # it cannot say which version or which channel it holds, so a pull of
          # it is not reproducible and, once alpha and beta tags become routine,
          # would silently hand contributors a pre-release image. Every other
          # artifact in this repo now states exactly what it is; this one does
          # too. A bare `docker pull` without a tag will fail by design — name
          # the version you want.
          tags: |
            type=raw,value=${{ steps.meta.outputs.version_tag }}
            type=raw,value=${{ steps.meta.outputs.version_stripped }}
          labels: |
            org.opencontainers.image.title=optn-docker-dev
            org.opencontainers.image.description=OPTN Wallet contributor/lab image
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build (and push on tag / dispatch)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: packages/docker-dev
          file: packages/docker-dev/Dockerfile
          platforms: ${{ steps.meta.outputs.platforms }}
          push: ${{ steps.meta.outputs.push == 'true' }}
          load: ${{ steps.meta.outputs.push != 'true' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          provenance: ${{ steps.meta.outputs.push == 'true' }}
          sbom: ${{ steps.meta.outputs.push == 'true' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke — node/npm as non-root
        if: steps.meta.outputs.push != 'true'
        run: |
          set -euo pipefail
          TAG="$(echo '${{ steps.docker_meta.outputs.tags }}' | head -n1)"
          docker run --rm --user 1000:1000 "$TAG" node -v
          docker run --rm --user 1000:1000 "$TAG" npm -v
          # tini entrypoint present
          docker run --rm --user 1000:1000 --entrypoint /usr/bin/tini "$TAG" --version
          id_out="$(docker run --rm --user 1000:1000 "$TAG" id)"
          echo "$id_out"
          echo "$id_out" | grep -E 'uid=1000' 

      - name: Attest build provenance (push only)
        if: steps.meta.outputs.push == 'true' && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be
        with:
          subject-name: ghcr.io/${{ steps.meta.outputs.owner_lc }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
