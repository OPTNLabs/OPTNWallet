name: Extension Preview

# Required always-on so a CI-only PR still builds Chrome and Firefox.
# Path filters previously skipped this job on PRs that only touched CI
# (for example OPTNLabs/OPTNWallet#53). Keep this workflow name so
# required checks still match.

# Mirrors desktop-preview.yml — builds the Chrome/Firefox extension MVP on
# every push/PR and uploads the unpacked build output as an artifact,
# so a reviewer can download it and load it directly without building locally.

on:
  # This check is required by the dev/staging ruleset. Keep the workflow
  # always-on so path-filtered changes do not leave an Expected check forever.
  # Widened from [dev] to [dev, staging] to match Android Preview so staging
  # PRs are not a hole.
  pull_request:
    # main included: a pull request straight to main is exactly the path
    # that would otherwise reach a release without these asset checks.
    branches: [dev, staging, main]
  push:
    branches: [dev, staging]
  # Allows a maintainer to recover the required check when GitHub does not
  # create the pull_request run for a head update.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: extension-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-extension-preview:
    name: Extension Preview
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build Chrome extension
        run: npm run build:extension:chrome

      - name: Build Firefox extension
        run: npm run build:extension:firefox

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-chrome
          path: dist-extension-chrome/**
          retention-days: 14
          if-no-files-found: error

      - name: Upload Firefox extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-firefox
          path: dist-extension-firefox/**
          retention-days: 14
          if-no-files-found: error
