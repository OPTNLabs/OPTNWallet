# Local build of the lab image + repo mount.
# For prebuilt GHCR image (after a release tag), see docker-compose.release.yml
#
#   docker compose -f packages/docker-dev/docker-compose.yml up -d --build
#   docker compose -f packages/docker-dev/docker-compose.yml --profile fusion-lab up -d --build
#
# NOT a consumer wallet. Chipnet/mocks for fusion. See PRODUCTION.md

name: optn-docker-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: optn-docker-dev:local
    working_dir: /optn
    user: "1000:1000"
    volumes:
      - ../..:/optn
    ports:
      - "${OPTN_VITE_PORT:-5173}:5173"
    environment:
      CI: "true"
      OPTN_DOCKER_DEV: "1"
      OPTN_TOR_SOCKS: "tor:9050"
    stdin_open: true
    tty: true
    init: true
    read_only: false
    security_opt:
      - no-new-privileges:true
    command: ["sleep", "infinity"]

  # Optional Chipnet/lab Tor SOCKS only — not a mainnet wallet appliance.
  tor:
    profiles: ["fusion-lab"]
    image: dperson/torproxy:latest
    restart: unless-stopped
    ports:
      - "${OPTN_TOR_HOST_PORT:-127.0.0.1:9050}:9050"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/lib/tor:uid=100,gid=100
