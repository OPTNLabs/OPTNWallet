# Local build of the lab image + repo mount.
# For prebuilt GHCR image (after a release tag), see docker-compose.release.yml
#
# Dev shell only (no fusion — Tor not required):
#   docker compose -f packages/docker-dev/docker-compose.yml up -d --build
#
# Fusion / VPS lab — Tor is MANDATORY (P2P CashFusion fail-closed):
#   docker compose -f packages/docker-dev/docker-compose.yml --profile fusion-lab up -d --build
#
# NOT a consumer wallet. Chipnet first. See PRODUCTION.md + VPS.md

name: optn-docker-dev

services:
  # Contributor shell — tests/tooling only. No CashFusion traffic.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: optn-docker-dev:local
    working_dir: /optn
    user: "1000:1000"
    volumes:
      - ../..:/optn
    ports:
      - "${OPTN_VITE_PORT:-5173}:5173"
    environment:
      CI: "true"
      OPTN_DOCKER_DEV: "1"
    stdin_open: true
    tty: true
    init: true
    security_opt:
      - no-new-privileges:true
    # Avoid double-tini (image ENTRYPOINT + compose init) on `compose run`
    entrypoint: ["bash", "-lc"]
    command: ["sleep infinity"]

  # --- fusion-lab: Tor is required, not optional ---
  tor:
    profiles: ["fusion-lab"]
    # Multi-arch manifest digest; update deliberately when changing Tor.
    image: docker.io/dperson/torproxy@sha256:d8b5f1cf24f1b7a0aa334929a264b2606a107223dd0d51eb1cda8aae6fbeec53
    restart: unless-stopped
    ports:
      - "${OPTN_TOR_HOST_PORT:-127.0.0.1:9050}:9050"
    security_opt:
      - no-new-privileges:true

  fusion-lab:
    profiles: ["fusion-lab"]
    image: optn-docker-dev:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /optn
    user: "1000:1000"
    depends_on:
      - tor
    network_mode: "service:tor"
    volumes:
      - ../..:/optn
      - optn-fusion-data:/optn-data
    environment:
      OPTN_DOCKER_DEV: "1"
      OPTN_ROOT: "/optn"
      # P2P CashFusion: Tor mandatory (desktop fail-closed policy)
      OPTN_TOR_REQUIRED: "1"
      # Shares the tor service's network (network_mode above), so Tor is on
      # loopback: fusion trusts a proxy by its local port only.
      OPTN_TOR_SOCKS: "127.0.0.1:9050"
      # Match desktop: P2P is the default; set OPTN_FUSION_MODE=server for classic server path
      OPTN_FUSION_MODE: "${OPTN_FUSION_MODE:-p2p}"
      OPTN_NETWORK: "${OPTN_NETWORK:-chipnet}"
      OPTN_DATA_DIR: "/optn-data"
      OPTN_TOR_PROBE_MS: "${OPTN_TOR_PROBE_MS:-5000}"
      OPTN_TOR_RECHECK_MS: "${OPTN_TOR_RECHECK_MS:-30000}"
      # Headless Auto Fusion: set OPTN_HEADLESS_CMD to
      # /optn/packages/docker-dev/scripts/fusion-lab-headless.sh with
      # OPTN_FUSION_MODE=server, OPTN_WALLET and OPTN_FUSION_SERVER. Empty
      # keeps the Tor hold loop.
      OPTN_HEADLESS_CMD: "${OPTN_HEADLESS_CMD:-}"
      OPTN_WALLET: "${OPTN_WALLET:-}"
      OPTN_FUSION_SERVER: "${OPTN_FUSION_SERVER:-}"
      OPTN_WALLET_PASSWORD_FILE: "${OPTN_WALLET_PASSWORD_FILE:-}"
      OPTN_FUSION_DEPTH: "${OPTN_FUSION_DEPTH:-3}"
      OPTN_FUSION_TIER: "${OPTN_FUSION_TIER:-}"
      OPTN_FUSION_HEALTH_FILE: "${OPTN_FUSION_HEALTH_FILE:-/optn-data/fusion-lab.health.json}"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    entrypoint: ["bash", "/optn/packages/docker-dev/scripts/fusion-lab-entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const fs=require('fs');const p=process.env.OPTN_FUSION_HEALTH_FILE||'/optn-data/fusion-lab.health.json';try{const j=JSON.parse(fs.readFileSync(p,'utf8'));process.exit(j.status==='tor_down'?1:0)}catch{process.exit(1)}",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

volumes:
  optn-fusion-data:
