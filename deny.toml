[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "aarch64-apple-ios",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = [
  { id = "RUSTSEC-2026-0207", reason = "libcrux-sha3 0.0.8 comes with hpke-rs 0.6.1 through openmls_rust_crypto 0.5.1 in MDK (optn-chat), and no hpke-rs 0.6 release takes the fixed 0.0.10. The flaw is in SHAKE's incremental multi-call squeeze; hpke-rs calls only the one-shot shake256, and only to derive X-Wing and ML-KEM keys, while MDK accepts ciphersuite 0x0001 (DHKEM X25519) alone. Remove when openmls_rust_crypto moves to an hpke-rs on libcrux-sha3 >=0.0.10." },
  { id = "RUSTSEC-2026-0208", reason = "libcrux-sha3 0.0.8, as for RUSTSEC-2026-0207: the panic is in the AVX2 SHAKE-256 used by ML-KEM and ML-DSA. hpke-rs calls the portable shake256, for X-Wing and ML-KEM keys only, which MDK's ciphersuite 0x0001 never derives. Remove with RUSTSEC-2026-0207." },
  { id = "RUSTSEC-2026-0212", reason = "libcrux-secrets 0.0.5 comes in through libcrux-traits 0.0.6 under libcrux-sha3 0.0.8 (see RUSTSEC-2026-0207); its aarch64 constant-time select and swap are not used on any path MDK's ciphersuite 0x0001 reaches. Remove with RUSTSEC-2026-0207." },
  { id = "RUSTSEC-2026-0253", reason = "lru 0.16.4 comes with mdk-memory-storage 0.8.0, MDK's in-memory store, which optn-chat uses in its tests only; the desktop uses MDK's SQLCipher store. LruCache::pop is unsound only when a key's Drop panics, and that store's keys are group ids, event ids and 32-byte arrays. Remove when mdk-memory-storage moves to lru >=0.18.2." },
  { id = "RUSTSEC-2024-0429", reason = "Tauri 2.11.5 Linux currently depends on GTK/glib 0.18.5; the RustSec fix requires glib >=0.20, outside Tauri's accepted GTK graph. OPTN does not call VariantStrIter directly. Remove this exception as soon as upstream Tauri/WebKitGTK moves to glib >=0.20." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]
