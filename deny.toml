[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-linux-android",
  "aarch64-apple-ios",
  "wasm32-unknown-unknown",
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"
workspace-default-features = "allow"
external-default-features = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Unlicense",
  "Zlib",
]

# sqlcipher-src is the SQLCipher source libsqlite3-sys 0.40 builds for the chat
# store, the first on a SQLite without RUSTSEC-2026-0459. Its expression adds
# two licences to the MIT and BSD-3-Clause allowed above: SQLite's
# public-domain dedication, for code libsqlite3-sys 0.35 shipped inside a
# package it declared as MIT, and the WTFPL, for libtomcrypt, which the crate
# carries as source and libsqlite3-sys never compiles (it builds SQLCipher on
# OpenSSL or CommonCrypto). Both are allowed for this crate only.
[[licenses.exceptions]]
crate = "sqlcipher-src"
allow = ["blessing", "WTFPL"]
