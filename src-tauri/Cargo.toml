[package]
name = "optn-wallet-desktop"
version = "1.7.3"
description = "OPTN Wallet Desktop"
authors = ["OPTNLabs"]
license = "GPL-3.0-only"
repository = "https://github.com/OPTNLabs/OPTNWallet"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }
# Compiles proto/fusion.proto (vendored from Electron Cash) into Rust types.
# protox is a pure-Rust protobuf compiler — deliberately used instead of
# prost-build's default path, which shells out to a `protoc` binary that is
# NOT installed on this machine or on the CI runners. Keeping the toolchain
# pure-Rust means `cargo build` just works everywhere with no extra setup.
prost-build = "0.13"
protox = "0.7"

[dependencies]
optn-multisig-core = { path = "../crates/optn-multisig-core", version = "=1.7.3" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-log = "=2.9.1"
tauri-plugin-notification = "=2.4.0"
tauri-plugin-fs = "=2.5.2"
tauri-plugin-dialog = "=2.7.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset", "json"] }
tauri-plugin-biometry = "=0.2.8"
# Clipboard. The WebView clipboard is not dependable: WKWebView resolves
# navigator.clipboard.writeText() and silently drops the write, and readText()
# is permission-gated. arboard talks to NSPasteboard / Win32 / X11 / Wayland
# directly. default-features = false drops image-data (and with it the image,
# core-graphics and windows-sys pulls) since only text is copied;
# wayland-data-control is NOT default and the Linux AppImage needs it.
# CashFusion: the protocol is raw TCP+TLS with protobuf framing, which a WebView
# cannot speak at all — hence a Rust-side client. rustls/tokio are already in
# the tree transitively via reqwest and tauri; naming them here just makes the
# direct dependency explicit.
prost = "0.13"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "process", "sync"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
webpki-roots = "0.26"
# Tor is reached as a SOCKS5 proxy (the same way Electron Cash does it) — we do
# not bundle or supervise a Tor daemon.
tokio-socks = "0.5"
# P2P CashFusion routes its Nostr relay traffic through Tor, which a WebView
# WebSocket cannot do. The WSS handshake runs in Rust over the same Tor+TLS stream
# the fusion client uses (connect_stream); tungstenite provides the WS framing and
# futures-util the sink/stream split. We supply our own TLS, so no TLS features.
tokio-tungstenite = { version = "0.23", default-features = false, features = ["handshake"] }
futures-util = "0.3"
# Process-wide connection registry for the native Electrum TCP transport.
once_cell = "1"
# BIP37 SPV: the BCH P2P protocol frames every message with a double-SHA256
# checksum, and block/merkle work needs SHA-256 too. Pure-Rust RustCrypto impl.
sha2 = "0.10"
# CashFusion round crypto — Pedersen commitments (amount*H + nonce*G) and blind
# Schnorr signatures need raw secp256k1 point/scalar arithmetic with a CUSTOM
# generator H, which the Bitcoin-Core secp256k1 bindings don't expose. k256
# (RustCrypto, pure Rust) does, and matches Electron Cash's scheme byte-for-byte.
k256 = "0.13"
optn-core = { path = "../crates/optn-core", version = "=1.7.3" }
optn-app = { path = "../crates/optn-app", version = "=1.7.3" }
optn-platform = { path = "../crates/optn-platform", version = "=1.7.3" }
optn-runtime = { path = "../crates/optn-runtime", version = "=1.7.3" }
optn-transport = { path = "../crates/optn-transport", version = "=1.7.3" }
# Concrete chain transports are shell-owned. Runtime/application crates only see
# provider-neutral capability/evidence traits.
optn-chain-electrum = { path = "../crates/optn-chain-electrum", version = "=1.7.3" }
optn-chain-bip37 = { path = "../crates/optn-chain-bip37", version = "=1.7.3" }
optn-chain-neutrino = { path = "../crates/optn-chain-neutrino", version = "=1.7.3" }
optn-chain-bchn = { path = "../crates/optn-chain-bchn", version = "=1.7.3" }
optn-chain-zmq = { path = "../crates/optn-chain-zmq", version = "=1.7.3" }
# Secure randomness for one-time nonces/blinding factors (OsRng). NOT the
# counter+clock token used for Tor circuit isolation — those must never be reused
# for crypto secrets.
rand_core = { version = "0.6", features = ["getrandom"] }
# BCH Schnorr's Jacobi-symbol convention needs a Legendre test y^((p-1)/2) mod p
# over the field prime. num-bigint gives a clear, correct modpow for it (k256's
# Scalar is mod the group order n, not the field prime p).
num-bigint = "0.4"
# hash160 = ripemd160(sha256(x)) for the P2PKH scriptCode when signing fusion
# inputs (BIP143 sighash). RustCrypto ripemd, pairs with the sha2 above.
ripemd = "0.1"
# CashFusion blame-phase ECIES: ephemeral ECDH -> sha256 key -> AES256-CBC(iv=0)
# -> HMAC-SHA256 tag. RustCrypto aes/cbc/hmac, matching encrypt.py.
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
# Hardware wallets (Ledger / Trezor One / OneKey HID): same model as Electron Cash
# and Ledger Live — OS USB HID from the native process, never WebView WebHID.
# Trezor Safe 5 / Model T: WebUSB via libusb (trezorlib WebUsbTransport).
# Modern Suite uses node-usb the same way — Bridge on :21325 is optional/legacy.
#
# On macOS this is built vendored (see the macOS target table below), so the
# dylib is not resolved from the build machine. Left dynamic elsewhere:
# vendoring compiles libusb's C, and the riscv64 and armv7 cross builds are
# deliberately kept free of anything that needs a C toolchain they do not have.
hex = "0.4"

# libusb, statically linked, for macOS only.
#
# A dynamically linked rusb records the build machine's own libusb path —
# /opt/homebrew/opt/libusb/lib/libusb-1.0.0.dylib — into the binary, so the app
# cannot launch on any machine without Homebrew's libusb at that exact path.
# Installing it does not help either: the bundle is signed with Hardened
# Runtime, which enforces Library Validation, and a Homebrew dylib can never
# share a Team ID with the app. That combination is unrunnable as shipped.
#
# `vendored` builds libusb 1.0.27 from source and links it statically, so there
# is no external dylib to resolve and nothing for Library Validation to reject.
# Fixes both halves of the launch failure rather than only the missing file.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
optn-platform-native = { path = "../crates/optn-platform-native", version = "=1.7.3", features = ["clipboard"] }
hidapi = "2.6"
tauri-plugin-keyring = "=0.1.0"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-clipboard-manager = "=2.3.2"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
rusb = "0.9"

[target.'cfg(target_os = "macos")'.dependencies]
rusb = { version = "0.9", features = ["vendored"] }
