[package]
name = "optn-wallet-desktop"
version = "1.6.2"
description = "OPTN Wallet Desktop"
authors = ["OPTNLabs"]
license = "GPL-3.0"
repository = "https://github.com/OPTNLabs/OPTNWallet"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }
# Compiles proto/fusion.proto (vendored from Electron Cash) into Rust types.
# protox is a pure-Rust protobuf compiler — deliberately used instead of
# prost-build's default path, which shells out to a `protoc` binary that is
# NOT installed on this machine or on the CI runners. Keeping the toolchain
# pure-Rust means `cargo build` just works everywhere with no extra setup.
prost-build = "0.13"
protox = "0.7"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "charset"] }
tauri-plugin-keyring = "0.1"
tauri-plugin-biometry = "0.2"
# CashFusion: the protocol is raw TCP+TLS with protobuf framing, which a
# WebView cannot speak at all — hence a Rust-side client. rustls/tokio are
# already in the tree transitively via reqwest and tauri; naming them here
# just makes the direct dependency explicit.
prost = "0.13"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt"] }
tokio-rustls = { version = "0.26", features = ["ring"] }
webpki-roots = "0.26"
# Tor is reached as a SOCKS5 proxy (the same way Electron Cash does it) — we do
# not bundle or supervise a Tor daemon.
tokio-socks = "0.5"
# Process-wide connection registry for the native Electrum TCP transport.
once_cell = "1"
