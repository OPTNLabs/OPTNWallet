# CodeRabbit — https://docs.coderabbit.ai/reference/configuration

language: 'en-US'

reviews:
  profile: chill
  request_changes_workflow: false
  review_status: true
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - 'dev'
      - 'main'
      - 'master'
      - 'release/.*'

  # Review all authored code, tests, fixtures and configuration by default.
  # Exclude only dependency/build output, known generated files and binaries.
  path_filters:
    - '!**/node_modules/**'
    - '!**/target/**'
    - '!target-frozen/**'
    - '!dist/**'
    - '!dist-ssr/**'
    - '!dist-extension-chrome/**'
    - '!dist-extension-firefox/**'
    - '!coverage/**'
    - '!android/.gradle/**'
    - '!android/build/**'
    - '!android/app/build/**'
    - '!ios/**/build/**'
    - '!ios/**/Pods/**'
    - '!apple/**/.build/**'
    - '!apple/**/.swiftpm/**'
    - '!src/wasm/optn-core/generated/**'
    - '!src/platform/web/secp256k1WasmBase64.generated.ts'
    # Exact lockfile names must not hide lock/block source or security tests.
    - '!**/Cargo.lock'
    - '!**/package-lock.json'
    - '!**/npm-shrinkwrap.json'
    - '!**/yarn.lock'
    - '!**/pnpm-lock.yaml'
    - '!**/bun.lock'
    - '!**/bun.lockb'
    - '!**/Podfile.lock'
    - '!**/Package.resolved'
    - '!**/gradle.lockfile'
    - '!**/*.{png,svg,jpg,jpeg,gif,ico,icns,webp}'
    - '!**/*.{wasm,class,jar,aar,apk,aab,ipa,exe,dll,so,dylib}'
    - '!**/*.snap'
