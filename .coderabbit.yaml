# CodeRabbit — https://docs.coderabbit.ai/reference/configuration
#
# Plan hard cap: 300 files per review (Pro+). This PR is ~500+ files vs dev.
# File count is after path_filters — so we WHITELIST ship-critical paths and
# drop noise. Everything else still lands in the PR; only the bot scope shrinks.
# Docs: https://docs.coderabbit.ai/management/plans

language: "en-US"

reviews:
  profile: chill
  request_changes_workflow: false
  review_status: true
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: true
    # Review PRs targeting dev (and release/*) as well as the default branch.
    base_branches:
      - "dev"
      - "main"
      - "master"
      - "release/.*"

  # Whitelist = only these paths are reviewed (under the 300-file cap).
  # Prefer include globs + noise excludes. Order: includes first, then !.
  path_filters:
    # --- product / security surface for PR #12 ship ---
    - "src/services/**"
    - "src/platform/desktop/**"
    - "src-tauri/**"
    - "scripts/**"
    - ".github/workflows/**"
    - "src/hooks/**"
    - "src/features/simple-send/**"
    - "src/features/watch-only-send/**"
    - "src/apis/WalletManager/**"
    - "src/apis/DatabaseManager/**"
    - "src/types/**"
    - ".coderabbit.yaml"
    # --- never review these ---
    - "!**/*lock*"
    - "!**/Cargo.lock"
    - "!**/package-lock.json"
    - "!**/yarn.lock"
    - "!src-tauri/target/**"
    - "!**/node_modules/**"
    - "!dist/**"
    - "!**/*generated*"
    - "!**/secp256k1WasmBase64.generated.ts"
    - "!**/*.png"
    - "!**/*.svg"
    - "!**/*.wasm"
    - "!**/*.snap"
    - "!**/fixtures/**"
    - "!**/__fixtures__/**"
    - "!public/**"
    - "!docs/**"
    - "!e2e/**"
    - "!tools/**"
    - "!test-support/**"
    - "!reference/**"
    - "!extension/**"
    - "!android/**"
    - "!ios/**"
    - "!patches/**"
    - "!schemas/**"
    - "!templates/**"
