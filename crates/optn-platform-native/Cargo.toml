[package]
name = "optn-platform-native"
version = "1.7.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Shell-independent native capability providers for OPTN Wallet."

[features]
default = []
clipboard = ["dep:arboard"]
secure-storage = ["dep:keyring"]
notifications = ["dep:notify-rust"]

[dependencies]
optn-platform = { path = "../optn-platform", version = "=1.7.3" }

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
arboard = { version = "=3.6.1", default-features = false, features = ["wayland-data-control"], optional = true }
keyring = { version = "=4.2.0", optional = true }
notify-rust = { version = "=4.18.0", optional = true }
