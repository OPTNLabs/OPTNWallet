[package]
name = "optn-chain-zmq"
version = "1.7.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Pure-Rust BCHN ZeroMQ event source for OPTN Wallet."

[dependencies]
optn-core = { path = "../optn-core", version = "=1.7.3" }
optn-runtime = { path = "../optn-runtime", version = "=1.7.3" }
tokio = { version = "1.53.1", features = ["sync"] }
zeromq = { version = "0.6.0", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
