[package]
name = "optn-mdk-store"
version = "1.7.3"
edition = "2021"
license = "MIT"
description = "A pure-Rust encrypted store for MDK (Marmot, MLS over Nostr): redb, every record sealed with XChaCha20-Poly1305 under a key the host derives."

[features]
default = []
# Make the store fail a chosen write, for crash tests here and in the crates
# that use it. Never enabled by a shipping build.
test-utils = []

[dependencies]
# RustCrypto, as the rest of the wallet uses. No primitive of our own.
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
zeroize = "1"
mdk-storage-traits = "0.8.0"
# The rust-nostr MDK 0.8 speaks: the types its storage traits are written in.
nostr = { version = "0.44", default-features = false, features = ["std"] }
openmls_traits = { version = "0.5", default-features = false }
# The database: one file, copy-on-write, no dependencies of its own. Pinned
# exactly; a new release is taken on purpose, with the crash tests run.
redb = "=4.6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
# MDK's own test helpers: key packages, group configs, rumors.
mdk-core = { version = "0.8.0", features = ["test-utils"] }
# The reference the differential test holds this store to.
mdk-memory-storage = "0.8.0"
mdk-storage-traits = { version = "0.8.0", features = ["test-utils"] }
tempfile = "3"
