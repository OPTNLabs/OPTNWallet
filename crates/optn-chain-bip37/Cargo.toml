[package]
name = "optn-chain-bip37"
version = "1.7.3"
edition = "2021"
license = "MIT"
description = "Portable BCH P2P/BIP37 chain provider for OPTN Wallet"

[dependencies]
optn-core = { path = "../optn-core", version = "=1.7.3" }
optn-runtime = { path = "../optn-runtime", version = "=1.7.3" }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt", "sync", "time"] }
tokio-socks = "0.5"
