[package]
name = "optn-core"
version = "1.7.3"
edition = "2021"
license = "MIT"
description = "Protocol core shared by the OPTN CLI and, via wasm32, the wallet."

# Every dependency here is pure Rust on purpose. This crate is built for the
# host, for the riscv64 and armv7 cross targets, and for wasm32 -- a C-backed
# crate would break at least one of those, and the whole point of the crate is
# that one implementation serves all of them.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sha2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
# `ecdh` is for NIP-44's shared secret; the rest was already here.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "std"] }
bip32 = { version = "0.5", default-features = false, features = ["alloc", "secp256k1", "std"] }
# No "rand": this crate only parses mnemonics, it never generates them.
# The rand feature pulls getrandom, which refuses to build for
# wasm32-unknown-unknown without a JS shim -- and generating a seed phrase
# is the CLI's job, not the protocol core's.
bip39 = { version = "2", default-features = false, features = ["std", "zeroize"] }
# CashFusion's Jacobi test is a modpow over the secp256k1 FIELD prime, which
# k256 does not expose. Both pure Rust and wasm-safe, and the same crates the
# desktop implementation already used -- so this is a move, not a reimplementation.
num-bigint = { version = "0.4", default-features = false }
once_cell = "1"
zeroize = { version = "1", features = ["derive"] }
base64 = { version = "0.22", default-features = false, features = ["alloc", "std"] }
# NIP-44 v2, the chat and CashFusion message ciphertext: ChaCha20 (no Poly1305 --
# the spec MACs separately with HMAC-SHA256) plus a constant-time comparison for
# the tag. Both are already in this repository's dependency graph, so this is a
# move rather than a new party to trust, and both are pure Rust and wasm-safe.
# Default features are just `cipher`, the trait the stream API lives behind.
chacha20 = "0.10"
# The wallet pack's cipher. AES-GCM is not something to hand-roll: GHASH is a
# GF(2^128) multiply whose naive form is table-driven and therefore timing
# sensitive. PBKDF2 rides on the hmac already here.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
subtle = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1", default-features = false, features = ["std"] }

# getrandom reaches this crate structurally, through rand_core, via bip32 and
# the k256/elliptic-curve stack -- it cannot be dropped without dropping
# secp256k1. On wasm32 it refuses to build unless told where entropy comes
# from, so point it at the host's crypto.getRandomValues.
#
# Target-gated on purpose: native, riscv64 and armv7 builds never see this and
# keep resolving getrandom the way they always did.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
# The binding surface the wallet calls. wasm32 only: no native, riscv64 or
# armv7 build links wasm-bindgen.
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
