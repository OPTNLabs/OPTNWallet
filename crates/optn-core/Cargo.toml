[package]
name = "optn-core"
version = "1.7.3"
edition = "2021"
license = "MIT"
description = "Protocol core shared by the OPTN CLI and, via wasm32, the wallet."

# Every dependency here is pure Rust on purpose. This crate is built for the
# host, for the riscv64 and armv7 cross targets, and for wasm32 -- a C-backed
# crate would break at least one of those, and the whole point of the crate is
# that one implementation serves all of them.
[dependencies]
sha2 = "0.10"
ripemd = "0.1"
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
bip32 = { version = "0.5", default-features = false, features = ["alloc", "secp256k1", "std"] }
# No "rand": this crate only parses mnemonics, it never generates them.
# The rand feature pulls getrandom, which refuses to build for
# wasm32-unknown-unknown without a JS shim -- and generating a seed phrase
# is the CLI's job, not the protocol core's.
bip39 = { version = "2", default-features = false, features = ["std"] }

[dev-dependencies]
serde_json = "1.0"

# getrandom reaches this crate structurally, through rand_core, via bip32 and
# the k256/elliptic-curve stack -- it cannot be dropped without dropping
# secp256k1. On wasm32 it refuses to build unless told where entropy comes
# from, so point it at the host's crypto.getRandomValues.
#
# Target-gated on purpose: native, riscv64 and armv7 builds never see this and
# keep resolving getrandom the way they always did.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
