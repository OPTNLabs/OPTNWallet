[package]
name = "optn-fusion"
version = "1.7.3"
edition = "2021"
license = "MIT"
description = "CashFusion protocol engine for OPTN Wallet: server and P2P rounds, covert transport, blame."

# Deliberately free of Tauri, Leptos and any renderer. This crate was extracted
# from `src-tauri/src/fusion/`, where it could only be reached through the
# shell's command surface -- which is why its only caller was TypeScript.
# Living here lets `optn-runtime` drive it directly.
[dependencies]
optn-core = { path = "../optn-core", version = "=1.7.3" }

aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
futures-util = "0.3"
hmac = "0.12"
k256 = "0.13"
log = "0.4"
once_cell = "1"
prost = "0.13"
rand_core = { version = "0.6", features = ["getrandom"] }
ripemd = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = [
  "ring",
  "logging",
  "tls12",
] }
tokio-socks = "0.5"
webpki-roots = "0.26"

[build-dependencies]
# Compiles proto/fusion.proto (vendored from Electron Cash) into Rust types.
# protox is a pure-Rust protobuf compiler, used instead of prost-build's default
# path because that shells out to a `protoc` binary which is not installed here
# or on CI.
prost-build = "0.13"
protox = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
