[package]
name = "optn-cli"
version = "1.7.3"
description = "OPTN Wallet command-line interface"
authors = ["OPTNLabs"]
license = "GPL-3.0"
repository = "https://github.com/OPTNLabs/OPTNWallet"
edition = "2021"
rust-version = "1.77.2"

[[bin]]
name = "optn"
path = "src/main.rs"

# Deliberately does not depend on the desktop crate. src-tauri pulls in tauri,
# which pulls in webkit2gtk on Linux, and that is what makes the desktop app
# impossible to cross-compile. Keeping this crate Tauri-free is the entire
# reason `optn` can be built for riscv64, armv7 and anything else Rust targets.
#
# Versions are pinned to match src-tauri/Cargo.toml so the two trees resolve to
# the same dependency versions and the audit baseline stays meaningful.
[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ripemd = "0.1"
# Same version src-tauri pins. ECDSA over secp256k1 in pure Rust, so it crosses.
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
# BIP32 with the pure-Rust k256 backend — the same curve crate src-tauri
# already uses. A C-backed secp256k1 would not cross-compile to riscv64.
bip32 = { version = "0.5", default-features = false, features = ["alloc", "secp256k1", "std"] }
# Mnemonics come from rust-bitcoin's bip39, not bip32's built-in one. bip32
# checks `entropy.len() != KEY_SIZE + 1`, which accepts 24-word phrases and
# rejects everything shorter — but this wallet imports 12-, 15-, 18-, 21- and
# 24-word phrases, so bip32's would have silently refused most real seeds.
bip39 = { version = "2", default-features = false, features = ["std", "rand"] }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt", "rt-multi-thread"] }
# default-features = false is load-bearing for cross-compilation: the default
# pulls aws-lc-sys, which builds C and CMake and does not cross to riscv64.
# ring is pure-ish Rust with a small asm surface and cross-compiles cleanly.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
webpki-roots = "0.26"
