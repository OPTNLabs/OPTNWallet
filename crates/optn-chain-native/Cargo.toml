[package]
name = "optn-chain-native"
version = "1.7.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Framework-neutral native chain adapter composition for OPTN Wallet."

[dependencies]
optn-core = { path = "../optn-core", version = "=1.7.3" }
optn-runtime = { path = "../optn-runtime", version = "=1.7.3" }
optn-chain-electrum = { path = "../optn-chain-electrum", version = "=1.7.3" }
optn-chain-bip37 = { path = "../optn-chain-bip37", version = "=1.7.3" }
optn-chain-neutrino = { path = "../optn-chain-neutrino", version = "=1.7.3" }
optn-chain-bchn = { path = "../optn-chain-bchn", version = "=1.7.3" }
optn-chain-zmq = { path = "../optn-chain-zmq", version = "=1.7.3" }
hex = "0.4"
# Coin holds are stored as JSON, the same shape the network overlay uses.
serde_json = "1.0"
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
tokio = { version = "1.53.1", features = ["io-util", "net", "sync", "time"] }
# Registry publications are HTTPS documents. This direct declaration reuses the
# already locked Rustls/SOCKS client used by native adapters; a registry fetch
# must not fall back to a renderer or platform HTTP stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
# `reqwest` re-exports `Url`, but not its typed host enum. Admit only URL
# domain hosts; this uses the version already locked through reqwest.
url = "2.5"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt", "io-util", "net"] }
