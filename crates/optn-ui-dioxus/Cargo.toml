[package]
name = "optn-ui-dioxus"
version = "1.7.3"
edition = "2021"
license = "GPL-3.0-only"
description = "A third renderer plugin on Dioxus, proving the host-block swap."

# Excluded from the workspace on purpose. It exists to demonstrate that a
# renderer built on Dioxus needs only optn-app and optn-transport; it must
# not put a windowing stack into the CI matrix that also cross-compiles for
# riscv64 and armv7.

[dependencies]
# Exactly what any renderer gets: view models and the typed transport.
optn-app = { path = "../optn-app", version = "=1.7.3" }
optn-transport = { path = "../optn-transport", version = "=1.7.3" }
# Headless SSR only — no dioxus-desktop, wry, tao, or winit.
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "signals"] }
dioxus-ssr = { version = "0.7", default-features = false }
