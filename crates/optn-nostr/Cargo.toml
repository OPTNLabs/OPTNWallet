[package]
name = "optn-nostr"
version = "1.7.3"
edition = "2021"
license = "MIT"
description = "Nostr relays for OPTN Wallet over the holder's verified Tor proxy: publish, subscribe and NIP-17 private messages, shared by P2P CashFusion and chat on every native surface."

# rust-nostr's maintained 0.45 line: the relay pool now lives in nostr-sdk,
# and 0.45 carries the 2026 security fixes (signature cache, NIP-44/NIP-04
# parsing, credential redaction). TLS through ring and the webpki roots, the
# stack the desktop's other Rust connections use.
[dependencies]
nostr = { version = "0.45.5", default-features = false, features = ["std", "nip44", "nip59", "os-rng"] }
nostr-sdk = { version = "0.45.4", default-features = false, features = ["ring", "rustls-tls-webpki-roots"] }
futures = "0.3"
tokio = { version = "1", features = ["sync", "time"] }
# A host's own dialer (the desktop's egress) hands over the stream and the
# WebSocket runs over it: the socket message type rust-nostr's transport
# speaks, and the handshake from the same tungstenite release.
async-wsocket = { version = "0.17", default-features = false }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[dev-dependencies]
nostr-sdk = { version = "0.45.4", default-features = false, features = ["ring", "rustls-tls-webpki-roots", "local-relay"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
