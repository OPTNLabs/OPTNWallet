[package]
name = "optn-chat"
version = "1.7.3"
edition = "2021"
license = "MIT"
description = "Marmot group chat (MLS over Nostr) for OPTN Wallet through MDK, the Marmot Development Kit, used as published, over optn-nostr's relays."

[features]
default = []
# MDK's own encrypted store: SQLCipher, keyed from the chat identity. SQLCipher
# is C; off Apple platforms its crypto is OpenSSL, built from source here, so a
# Windows build needs a full Perl (Strawberry) named by OPENSSL_SRC_PERL. Apple
# builds use CommonCrypto. Without it, a host brings its own MDK store
# (the tests use MDK's in-memory one).
sqlite = ["dep:mdk-sqlite-storage", "dep:libsqlite3-sys"]

[dependencies]
mdk-core = "0.8.0"
mdk-storage-traits = "0.8.0"
mdk-sqlite-storage = { version = "0.8.0", optional = true }
# MDK speaks rust-nostr 0.44 while the relays speak 0.45 (optn-nostr). Events
# cross between them as NIP-01 JSON, which both write the same way.
mdk-nostr = { package = "nostr", version = "0.44", default-features = false, features = ["std"] }
optn-nostr = { path = "../optn-nostr", version = "=1.7.3" }
# MDK's store is reached through OpenMLS's provider trait: the engine reads
# MDK's own record of which group events it has processed.
openmls_traits = { version = "0.5", default-features = false }
futures = "0.3"
hex = "0.4"
hkdf = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync", "time"] }
zeroize = "1"

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
libsqlite3-sys = { version = "0.35", optional = true, features = ["bundled-sqlcipher-vendored-openssl"] }

[dev-dependencies]
mdk-memory-storage = "0.8.0"
nostr-sdk = { version = "0.45.4", default-features = false, features = ["ring", "rustls-tls-webpki-roots", "local-relay"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
