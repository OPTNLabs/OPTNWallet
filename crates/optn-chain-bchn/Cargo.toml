[package]
name = "optn-chain-bchn"
version = "1.7.3"
edition = "2021"
license = "GPL-3.0-only"
description = "Rust-native BCHN RPC provider for OPTN Wallet."

[dependencies]
optn-core = { path = "../optn-core", version = "=1.7.3" }
optn-runtime = { path = "../optn-runtime", version = "=1.7.3" }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Keep RPC decimal fields lexically exact until the adapter converts them to
# satoshis; the default float-backed `Number` can reformat one sat as `1e-8`.
serde_json = { version = "1", features = ["arbitrary_precision"] }
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
