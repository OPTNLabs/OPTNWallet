[package]
name = "optn-x402"
version = "1.7.3"
edition = "2021"
rust-version = "1.93"
license = "GPL-3.0-only"
description = "OPTN adapter for the BCH x402 exact SDK"
repository = "https://github.com/OPTNLabs/OPTNWallet"

[dependencies]
# OPTNLabs/x402-bch#2 is not merged yet. Pin the reviewed PR revision;
# replace the source with an immutable OPTNLabs revision after it merges.
x402-chain-bch = { git = "https://github.com/CyberAshven/x402-bch", rev = "a6e50946f95ce6e65bb3d08071eb49584786fba9" }
x402-types = "=2.0.2"
async-trait = "0.1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
optn-core = { path = "../optn-core", version = "=1.7.3" }
tokio = { version = "1", features = ["macros", "rt"] }
